{el:7,cite:"7.9 · Cost of trading",teach:"Apply the arithmetic carefully: net profit equals gross gain minus <b>all</b> transaction costs. A flat fee charged <b>per transaction</b> is paid on both the buy and the sell, so two fees come out — a favourite exam trap where only one gets deducted.",
q:"An investor buys 500 shares at $40 and sells at $50. The broker charges a $20 flat fee per transaction. Net profit?",
o:["$24,980","$19,980","$5,000","$4,960"],
a:3,why:"Gross gain is 500 x $10 = $5,000. Two transactions at $20 each is $40 in fees, leaving $4,960. Choosing $5,000 ignores costs; the larger figures mistake sale proceeds for profit."},
{el:8,cite:"8.1 · Options",teach:"An option gives the holder a right, not an obligation. The style says <b>when</b> that right can be used: <b>American-style</b> options can be exercised <b>any time up to and including expiry</b>; <b>European-style</b> options only <b>on the expiration date</b>. The extra flexibility of American style tends to make it worth more, not less.",
q:"What is a key characteristic of American-style options?",
o:["They can be exercised only on the expiration date","They can be exercised any time up to and including expiration","They are typically cheaper than European options","They trade only on North American exchanges"],
a:1,why:"Style is about timing of exercise, not geography — European-style options are traded in North America all the time. And more flexibility generally commands a higher premium."},

{el:8,cite:"8.2 · Futures",teach:"A <b>future</b> is a standardized, exchange-traded obligation to buy or sell at a set price on a set date. Both sides are <b>obliged</b> — there is no choice to walk away as there is with an option — and settlement may be by <b>physical delivery or in cash</b>, depending on the contract.",
q:"Which is a key characteristic of a futures contract?",
o:["The holder may exercise it any time before settlement","Delivery of the underlying asset is always required at settlement","It can be settled in cash or by physical delivery of the underlying","It has a strike price and is bought for a premium"],
a:2,why:"Cash or physical settlement, depending on the contract specification. Exercise, strike price and premium are options language — a future is an obligation, not a right."},

{el:8,cite:"8.3 · Uses",teach:"Three motives. <b>Hedging</b> — offsetting an existing exposure to reduce risk. <b>Speculation</b> — taking a position purely on a price view. <b>Arbitrage</b> — exploiting a <b>price discrepancy between markets</b> for the same or equivalent asset, ideally with little directional risk.",
q:"A trader buys a copper future in London and simultaneously sells one in Chicago to profit from mispricing. This is:",
o:["Hedging, since two futures offset each other","Speculative trading on future price movements","Arbitrage, profiting from a price discrepancy between two markets","Risk management against market volatility"],
a:2,why:"Simultaneous offsetting positions in two venues to capture a price gap is textbook arbitrage. It is not hedging, because there is no underlying commercial exposure being protected."},

{el:8,cite:"8.4 · Margin",teach:"In futures, <b>margin is not a down payment on the asset</b> — it is a good-faith deposit of collateral that opens and maintains the position, sized to cover potential losses. Positions are <b>marked to market</b> daily, and a fall in value triggers a margin call for more collateral.",
q:"What best describes the role of margin in futures trading?",
o:["The market value of the asset, unrelated to collateral","The total money needed to close a position including all profits and losses","Collateral paid in full upfront to purchase the full contract value","Money deposited to open and maintain a position, ensuring enough collateral to cover potential losses"],
a:3,why:"Deposit plus maintenance is the function, and it is a fraction of contract value — which is exactly where the leverage comes from. Paying the full contract value upfront would eliminate that leverage."},

{el:8,cite:"8.5 · Listed vs OTC",teach:"<b>Listed</b> derivatives are standardized, exchange-traded and <b>centrally cleared</b>, so a clearing house stands between the parties. <b>OTC</b> derivatives are privately negotiated: more flexible terms, but higher <b>liquidity risk</b> (harder to exit) and higher <b>counterparty risk</b> (you depend on the other side paying).",
q:"Which is a key difference between listed and OTC derivatives?",
o:["Liquidity risk is higher for OTC derivatives than listed","Counterparty risk is higher for listed derivatives than OTC","Capital at risk is always greater for OTC than listed","Flexibility is greater for listed than OTC"],
a:0,why:"OTC contracts are bespoke, so there may be no ready buyer — that is liquidity risk. Options B and D reverse the truth: clearing reduces counterparty risk on listed products, and OTC is the flexible one."},

{el:8,cite:"8.8 · Prohibited practices",teach:"Derivative accounts carry hard limits. Trading <b>while under margin</b>, trading <b>beyond margin or credit limits</b>, and allowing <b>cumulative losses to exceed agreed risk limits</b> are prohibited practices — the client's appetite does not override them, and the firm must monitor and act.",
q:"A client whose account is under margin insists on placing another futures trade. What is correct?",
o:["Accept the trade, since the client accepts the risk","Refuse — trading while under margin is a prohibited practice","Accept it if the client signs a waiver","Accept it and issue a margin call afterwards"],
a:1,why:"This is a hard prohibition, not a suitability judgement the client can waive. The deficiency must be resolved before further trading."},

{el:9,cite:"9.2 · Conflicts",teach:"The conflicts rule runs in a strict order: <b>avoid</b> conflicts that cannot be addressed in the client's best interest; otherwise <b>address</b> them through controls; and <b>disclose</b> them clearly. Disclosure alone never cures a conflict that cannot be managed — if it cannot be addressed, it must be avoided.",
q:"A conflict between a client and the dealer cannot be satisfactorily addressed under the rules. What must happen?",
o:["The conflict must be minimized","The conflict must be avoided","The client must be released","The client must be investigated"],
a:1,why:"Avoidance is the answer of last resort and it is mandatory. Minimizing a conflict that cannot be addressed still leaves the client exposed, and disclosure is not a substitute for either."},

{el:9,cite:"9.2 · Proprietary product",teach:"Recommending your own firm's fund is not banned — it is a <b>conflict to be identified, addressed and disclosed</b>. The concern is that a proprietary product may be chosen for the firm's benefit when a <b>third-party product would suit the client better</b>, which is a suitability failure dressed up as a house preference.",
q:"Why can recommending a proprietary fund to a retail client be a conflict of interest?",
o:["Retail clients cannot invest in investment funds","Dealers may not sell their own funds to clients","The commission may be higher than on other investments","Third-party products may be better suited to the client"],
a:3,why:"The client-first standard is the frame: the risk is a better-suited alternative going unrecommended. Commission is a related concern, but the rule is anchored in suitability, not just pay."},

{el:9,cite:"9.9 · Referrals",teach:"Referral arrangements must go through the firm. A representative may not privately arrange to be paid for sending clients elsewhere: the arrangement needs the <b>Investment Dealer's approval</b> first, must be documented, and is then disclosed to the client. Approval comes before the referral, not after the cheque.",
q:"A representative earns a referral fee from an outside company for recommending its services. To stay compliant they must:",
o:["Stop making referrals to avoid any conflict","Accept the fee after telling the client about the arrangement","Ensure the activity is approved by the Investment Dealer before making referrals","Proceed as normal, since it serves the client's interests"],
a:2,why:"Firm approval is the gate, with disclosure to the client alongside it. Disclosure by itself does not authorize an arrangement the firm has never sanctioned or supervised."},

{el:9,cite:"9.2 · Personal holdings",teach:"Where an advisor personally owns a security they want to buy for a client, the conflict is real but usually manageable: <b>disclose the ownership to the client</b> so they can decide with full information, and follow the firm's controls. Concealing it is the violation.",
q:"An advisor wants to buy shares of a small listed company for a client's account and personally owns shares in it. What must they do?",
o:["Invest for the client without disclosing the holding","Avoid the investment entirely to eliminate the conflict","Transfer the account to another advisor","Disclose their ownership to the client and let the client decide"],
a:3,why:"Informed client consent is the proportionate response here. Blanket avoidance and handing off the account are over-corrections, and silent execution is the clear breach."},

{el:9,cite:"9.7 · Personal financial dealing",teach:"<b>Personal financial dealing</b> with clients is largely prohibited: taking payment directly from a client for services, borrowing from or lending to clients, settling complaints from personal funds, or accepting client guarantees. The narrow permitted case is acting under a <b>power of attorney for a Related Person</b> — a family member — subject to firm approval.",
q:"Which would comply with the rules on personal financial dealing?",
o:["Accepting consideration directly from a client for services provided","Settling a complaint by repaying losses from personal funds","Receiving a client guarantee for a personal investment loan","Acting under a power of attorney for a client who is a Related Person"],
a:3,why:"Family POAs are the recognized exception, handled with disclosure and firm approval. The other three are the canonical prohibited dealings — direct payment, private settlement and client guarantees."},

{el:9,cite:"9.8/9.9 · Outside activities",teach:"Activities outside the dealer — a board seat, a second business, a <b>position of influence</b> such as a role in a community or professional body — require firm review. The tests are potential <b>client confusion</b>, conflicts of interest, adequate supervision and controls, due diligence before approval, and proper record-keeping.",
q:"A representative is offered a paid director role at a local charity that many of their clients support. What does CIRO expect?",
o:["No action, because charity work is not a business activity","The activity is submitted for firm review, considering client confusion, conflicts, supervision and records","Automatic prohibition of any outside role","Disclosure to clients only, with no firm involvement"],
a:1,why:"Outside activities are approved and supervised, not automatically banned or automatically fine. A position of influence over clients is exactly the scenario the rule targets."},

{el:9,cite:"9.3 · Churning",teach:"<b>Churning</b> is excessive trading in a client's account driven by the <b>commissions it generates</b> rather than the client's objectives. The tell is turnover that cannot be justified by the investment strategy — and it breaches both the suitability and the client-first standards.",
q:"What is the primary motivation behind churning?",
o:["To generate excessive commissions or fees","To maximize portfolio returns","To align with the client's investment goals","To improve diversification"],
a:0,why:"Commission generation at the client's expense is the definition. Every other option describes a legitimate purpose, which is precisely the cover churning hides behind."},

{el:9,cite:"9.4 · Ethics vs rules",teach:"Rules are <b>precise but finite</b> — they cannot anticipate every situation. Ethics are <b>general obligations</b> that still apply where the rulebook is silent or ambiguous. Legal responsibilities tend to be specific and enforceable; ethical responsibilities are broader in scope.",
q:"Why does the investment industry emphasize ethical practice alongside rules?",
o:["Rules are not binding without ethical statements","Ethical practices are more specific than rules","Rules are driven by personal values, while ethics are precise","Ethical practice still applies where rules fall short"],
a:3,why:"Ethics fills the gaps the rulebook cannot foresee. Note the direction of travel: rules are the precise ones, ethics the general ones — several distractors invert that."},

{el:9,cite:"9.5 · Standards of conduct",teach:"The purpose of ethical principles and standards of conduct is not to add procedure — it is to protect <b>investor confidence in the integrity of the securities and derivatives markets</b>. Markets only function while participants believe they are being treated fairly.",
q:"What is the purpose of ethical principles and standards of conduct in the industry?",
o:["To ensure suitability determination rules are met at all times","To ensure investor confidence in the integrity of securities and derivatives markets is not diminished","To set out the specific steps an Approved Person must take with clients","To provide a code of behaviour that replaces prescriptive rules"],
a:1,why:"Market confidence is the stated goal. Standards of conduct are deliberately principle-based, so they neither list specific steps nor replace the rules — they sit alongside them."},

{el:9,cite:"9.3 · Firm pressure",teach:"When a firm directive collides with a client's interest, the <b>client-first standard wins</b>. The ethical route is to <b>not recommend</b> the product to a client it does not suit, and to <b>explain the reasoning to the firm</b>. Following orders is not a defence, and neither is a warning bolted onto an unsuitable recommendation.",
q:"A dealer instructs all RRs to recommend a product; an RR believes it is not in one client's best interests. The ethical response is:",
o:["Avoid recommending it to that client and explain to the firm why it is unsuitable","Recommend it while emphasizing it does not meet suitability requirements","Ignore the instruction and say nothing to anyone","Recommend it as instructed, since the firm bears responsibility"],
a:0,why:"Decline for that client and escalate the reasoning. Recommending something you have labelled unsuitable is a contradiction, and silently ignoring a firm directive fixes nothing at the firm level."},

{el:9,cite:"9.11 · Inside information",teach:"<b>Material non-public information (MNPI)</b> is information that could affect a security's price and has not been released. If you receive it accidentally, you must <b>not trade on it and not pass it on</b> — you escalate to <b>compliance</b>, who will apply controls such as adding the name to a <b>restricted or grey list</b>.",
q:"An advisor inadvertently receives material non-public information in a client meeting. The ethical course is:",
o:["Use it for the client's benefit only","Escalate to compliance and refrain from acting on the information","Share it only with the firm's internal investment team","Ignore it and continue advising as usual"],
a:1,why:"Escalate and freeze. Trading on it is insider trading whoever benefits, and passing it to colleagues is tipping — which is why sharing internally is not the safe option it appears to be."},

{el:9,cite:"9.11 · Controlling information",teach:"Firms manage inside information structurally. <b>Information barriers</b> (firewalls) separate departments that hold confidential information from those that trade or advise. A <b>grey list</b> is confidential and used to monitor firm activity in a name; a <b>restricted list</b> is circulated and blocks trading or research in that name.",
q:"Which describes the difference between a grey list and a restricted list?",
o:["A grey list is confidential and used for monitoring; a restricted list is circulated and prohibits activity","A grey list prohibits trading; a restricted list is advisory only","Both are published to clients before a transaction","Neither has any effect on employee trading"],
a:0,why:"Grey means watch quietly; restricted means stop, and staff are told. Neither list goes to clients — publishing a grey list would leak the very transaction it exists to protect."},

{el:9,cite:"9.3 · Handling errors",teach:"When a Portfolio Manager discovers a trade that did not match the client's KYC, the answer is <b>transparency</b>: notify the client and document the error under firm policy. Reversing the trade does not erase it, and adjusting the record or chasing the loss back with a second bet compounds one error into misconduct.",
q:"A Portfolio Manager buys a stock that does not fit the client's KYC and sells it at a small loss. What should they do?",
o:["Notify the client and document the error as per firm policy","Explain the loss as a normal risk of the relationship","Reinvest the proceeds in a rising stock to offset the loss","Delete the record of the trade since it has been reversed"],
a:0,why:"Disclose and document. Deleting records is falsification, and trying to trade back a loss turns a suitability error into gambling with client money."},
];

/* ================= STATE ================= */
const S = {
  lessonDone:{}, starLesson:{}, starQ:{}, qStats:{}, mistakes:{}, cardKnown:{}, srs:{},
  lastLesson:0, sessions:0,
  set:{ shuffle:true, dark:false, ts:1, speedClock:true, examClock:true }
};
const KEY="cire:v2";
let saveTimer=null;
function save(){
  if(saveTimer) clearTimeout(saveTimer);
  saveTimer=setTimeout(function(){
    try{ if(window.storage&&window.storage.set) window.storage.set(KEY,JSON.stringify(S)); }catch(e){}
  },400);
}
function normalise(){
  ["lessonDone","starLesson","starQ","qStats","mistakes","cardKnown","srs"].forEach(function(k){
    if(!S[k] || typeof S[k]!=="object") S[k]={};
  });
  if(!S.set || typeof S.set!=="object") S.set={};
  const d={shuffle:true,dark:false,ts:1,speedClock:true,examClock:true};
  for(const k in d) if(S.set[k]===undefined) S.set[k]=d[k];
}
function load(){
  return new Promise(function(res){
    try{
      if(!(window.storage&&window.storage.get)) return res();
      Promise.resolve(window.storage.get(KEY)).then(function(r){
        if(r&&r.value){ try{ const o=JSON.parse(r.value); for(const k in o) S[k]=o[k]; }catch(e){} }
        res();
      }).catch(function(){res();});
    }catch(e){ res(); }
  });
}
function applySettings(){
  document.body.classList.toggle("dark",!!S.set.dark);
  document.body.classList.remove("ts0","ts2","ts3");
  if(S.set.ts===0) document.body.classList.add("ts0");
  if(S.set.ts===2) document.body.classList.add("ts2");
  if(S.set.ts===3) document.body.classList.add("ts3");
}

/* ================= FEEDBACK ================= */
function haptic(kind){
  try{
    if(!navigator.vibrate) return;
    if(kind==="tick") navigator.vibrate(8);
    else if(kind==="ok") navigator.vibrate(14);
    else if(kind==="no") navigator.vibrate([12,50,12]);
    else if(kind==="done") navigator.vibrate([18,60,28]);
  }catch(e){}
}
function announce(msg){
  const l=document.getElementById("live");
  if(l) l.textContent=msg;
}
let toastT=null;
function toast(msg,actionLabel,action){
  const t=document.getElementById("toast"), m=document.getElementById("toastMsg"), b=document.getElementById("toastAct");
  m.textContent=msg;
  if(actionLabel){ b.textContent=actionLabel; b.classList.remove("hide"); b.onclick=function(){ hideToast(); action(); }; }
  else b.classList.add("hide");
  t.classList.add("on");
  if(toastT) clearTimeout(toastT);
  toastT=setTimeout(hideToast,3200);
}
function hideToast(){ document.getElementById("toast").classList.remove("on"); }

function setLine(c,i){ document.documentElement.style.setProperty("--line",c);
  document.documentElement.style.setProperty("--lineink",i); }
function shuffle(a){a=a.slice();for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}return a;}
function enterAnim(){ app.classList.remove("enter"); void app.offsetWidth; app.classList.add("enter"); }
function toTop(){ window.scrollTo(0,0); const p=document.getElementById("pane"); if(p&&p.scrollTo) p.scrollTo(0,0); }

function split(on){ document.body.classList.toggle("split",!!on); }
function stopTimer(){ if(timer){clearInterval(timer);timer=null;} if(clock) clock.style.display="none"; }
function bul(n,c,i,cls){ return '<span class="bullet '+(cls||"")+'" style="background:'+c+';color:'+i+'">'+n+'</span>'; }
function strip(h){ return h.replace(/<br\s*\/?>/gi," ").replace(/<[^>]+>/g,"").replace(/\s+/g," ").trim(); }
function firstSent(t,n){
  const parts=strip(t).split(". ");
  return parts.slice(0,n).join(". ").replace(/\.?$/,".");
}
function pctDone(){ return Math.round(Object.keys(S.lessonDone).length/LESSONS.length*100); }
function recordQ(el,right,qi){

/* ================= FLASHCARDS =================
   Grading follows the SM-2 pattern used by Anki: four grades, an ease
   factor per card, and intervals that stretch or collapse with recall.
   ============================================================ */
const DAY=86400000;
function srs(i){
  if(!S.srs) S.srs={};
  if(!S.cardKnown) S.cardKnown={};
  if(!S.srs[i]){
    S.srs[i] = S.cardKnown && S.cardKnown[i]
      ? {ef:2.5,n:2,iv:3,due:Date.now()}
      : {ef:2.5,n:0,iv:0,due:0};
  }
  return S.srs[i];
}
function nextIv(c,g){
  const ef=c.ef||2.5, n=c.n||0, iv=c.iv||0;
  if(g===0) return 0;
  if(g===1) return n===0?1:Math.max(1,Math.round(iv*1.2));
  if(g===2) return n===0?1:(n===1?3:Math.max(2,Math.round(iv*ef)));
  return n===0?3:Math.max(4,Math.round(iv*ef*1.3));
}
function fmtIv(d){
  if(d<=0) return "in this session";
  if(d===1) return "1 day";
  if(d<30) return d+" days";
  if(d<60) return "1 month";
  return Math.round(d/30)+" months";
}
function fmtIvShort(d){
  if(d<=0) return "again";
  if(d<30) return d+"d";
  return Math.round(d/30)+"mo";
}
function grade(i,g){
  const c=srs(i), iv=nextIv(c,g);
  c.ef=Math.max(1.3,Math.min(2.8,(c.ef||2.5)+[-0.2,-0.15,0,0.1][g]));
  c.n=g===0?0:(c.n||0)+1;
  c.iv=iv;
  c.due=Date.now()+iv*DAY;
  if(!S.cardKnown) S.cardKnown={};
  if(g===0) delete S.cardKnown[i]; else S.cardKnown[i]=1;
  save();
}
function deckCounts(){
  const now=Date.now(); let due=0,fresh=0,known=0;
  LESSONS.forEach(function(_,i){
    const c=srs(i);
    if(c.n===0 && !c.due) fresh++;
    else if(c.due<=now) due++;
    else known++;
  });
  return {due:due,fresh:fresh,known:known};
}

function startCards(which){
  let q=[]; const now=Date.now();
  if(which==="due"){
    const due=[], fresh=[];
    LESSONS.forEach(function(_,i){ const c=srs(i);
      if(c.n===0 && !c.due) fresh.push(i); else if(c.due<=now) due.push(i); });
    q=shuffle(due).concat(shuffle(fresh)).slice(0,30);
  } else if(which==="all"){
    q=shuffle(LESSONS.map(function(_,i){return i;}));
  } else {
    const s=chStart[which], e=chEnd[which];
    for(let i=s;i<=e;i++) q.push(i);
    q=shuffle(q);
  }
  if(!q.length){ toast("Nothing to study there"); return; }
  ctx.cq=q; ctx.cpos=0; ctx.flipped=false; ctx.cCount=[0,0,0,0]; ctx.cSeen=0; ctx.undo=null;
  view="cardrun"; running(true); split(false); renderCard(); toTop();
}

function flipCard(){

/* ---- drag ----------------------------------------------------------
   Handlers live on .dragzone, an untransformed sibling layer. The card
   itself is pointer-events:none, so a rotated or mirrored face can never
   swallow or displace a pointer. Movement is applied to the thrower.
   ------------------------------------------------------------------- */
function attachDrag(){
  const zone=document.getElementById("dragzone");
  const card=document.getElementById("thrower");
  if(!zone||!card) return;
  const tags={l:document.getElementById("tagl"),r:document.getElementById("tagr"),
              u:document.getElementById("tagu"),d:document.getElementById("tagd")};
  let x0=0,y0=0,dx=0,dy=0,down=false,armed=false,moved=false,pid=null;

  function width(){
    const r=zone.getBoundingClientRect();
    return r.width || zone.offsetWidth || 300;
  }
  function thresh(){ return Math.max(64, width()*0.26); }
  function dirOf(){
    if(Math.abs(dx)>=Math.abs(dy)) return dx<0?"l":"r";
    return dy<0?"u":"d";
  }
  function clearTags(){ for(const k in tags) if(tags[k]) tags[k].style.opacity=0; }
  function paint(){
    card.style.transform="translate("+dx+"px,"+dy+"px) rotate("+(dx/20)+"deg)";
    const t=thresh(), d=dirOf();
    const mag=Math.abs(dx)>=Math.abs(dy)?Math.abs(dx):Math.abs(dy);
    for(const k in tags) if(tags[k]) tags[k].style.opacity = (k===d ? Math.min(mag/t,1) : 0);
    const past=mag>=t;
    if(past&&!armed){ armed=true; haptic("tick"); }
    else if(!past&&armed){ armed=false; }
  }
  function start(e){
    if(ctx.throwing) return;
    down=true; moved=false; dx=0; dy=0; armed=false;
    x0=e.clientX; y0=e.clientY; pid=e.pointerId;
    card.classList.remove("settle","fling");
    zone.classList.add("grabbing");
    try{ zone.setPointerCapture(e.pointerId); }catch(err){}
  }
  function move(e){
    if(!down) return;
    dx=e.clientX-x0; dy=e.clientY-y0;
    if(!moved && (Math.abs(dx)>5||Math.abs(dy)>5)) moved=true;
    if(!moved) return;
    if(!ctx.flipped){ dx=0; dy=0; return; }   /* no dragging before the reveal */
    e.preventDefault();                        /* stop the page taking the gesture */
    paint();
  }
  function end(e){
    if(!down) return;
    down=false;
    zone.classList.remove("grabbing");
    try{ if(pid!==null) zone.releasePointerCapture(pid); }catch(err){}
    pid=null;
    if(!ctx.flipped){ if(!moved) flipCard(); dx=0; dy=0; return; }
    if(!moved){ dx=0; dy=0; return; }
    const t=thresh();
    const horiz=Math.abs(dx)>=Math.abs(dy);
    const mag=horiz?Math.abs(dx):Math.abs(dy);
    if(mag>=t){
      throwCard(horiz?(dx<0?0:2):(dy<0?3:1), dx, dy);
    } else {
      card.classList.add("settle");
      card.style.transform="translate(0,0) rotate(0deg)";
      clearTags();
    }
    dx=0; dy=0; armed=false;
  }
  zone.addEventListener("pointerdown",start);
  zone.addEventListener("pointermove",move,{passive:false});
  zone.addEventListener("pointerup",end);
  zone.addEventListener("pointercancel",end);
  /* touch fallback for engines that fire touch but not pointer events */
  if(!window.PointerEvent){
    zone.addEventListener("touchstart",function(e){ start(e.changedTouches[0]); },{passive:true});
    zone.addEventListener("touchmove",function(e){
      const t=e.changedTouches[0];
      if(down && ctx.flipped && moved) e.preventDefault();
      move(t);
    },{passive:false});
    zone.addEventListener("touchend",function(e){ end(e.changedTouches[0]); });
  }
}

function throwCard(g,dx,dy){
  if(ctx.throwing) return; ctx.throwing=true;
  const el=document.getElementById("thrower");
  if(el){
    const w=window.innerWidth||600, h=window.innerHeight||800;
    const dir=DIRS[g];
    let tx=0,ty=0,rot=0;
    if(dir==="l"){ tx=-w*1.1; rot=-18; }
    if(dir==="r"){ tx=w*1.1;  rot=18; }
    if(dir==="u"){ ty=-h*0.9; rot=(dx||0)/30; }
    if(dir==="d"){ ty=h*0.9;  rot=(dx||0)/30; }
    el.classList.remove("settle");
    el.classList.add("fling");
    el.style.transform="translate("+tx+"px,"+ty+"px) rotate("+rot+"deg)";
    el.style.opacity="0";
  }
  setTimeout(function(){ ctx.throwing=false; gradeCard(g); },300);
}

function gradeCard(g){
  const li=ctx.cq[ctx.cpos], before=JSON.parse(JSON.stringify(srs(li)));
  grade(li,g);
  ctx.cCount[g]++; ctx.cSeen++;
  haptic(g===0?"no":"ok");
  const labels=["Again","Hard","Good","Easy"];
  const iv=srs(li).iv;
  ctx.undo={li:li,before:before,pos:ctx.cpos,g:g};
  toast(labels[g]+" \u00b7 back "+fmtIv(iv),"Undo",function(){
    S.srs[ctx.undo.li]=ctx.undo.before; ctx.cCount[ctx.undo.g]--; ctx.cSeen--;
    if(ctx.undo.g===0) ctx.cq.pop();
    ctx.cpos=ctx.undo.pos; save(); renderCard();
  });
  if(g===0) ctx.cq.push(li);
  ctx.cpos++; renderCard();
}

function weakestEl(){
  let worst=1, wp=2;
  for(let el=1;el<=9;el++){
    const s=S.qStats[el];
    const p=s&&s.t>=3 ? s.c/s.t : 1.5;
    if(p<wp){ wp=p; worst=el; }
  }
  return worst;
}
function renderMistakes(){ ctx.queue=Object.keys(S.mistakes).map(Number); if(!ctx.queue.length) return renderStats(); beginDrill(); }
function beginDrill(){ ctx.pos=0; ctx.results=[]; ctx.streak=0; ctx.best=0; view="drillrun"; running(true); split(true); renderQ(); toTop(); }
function renderQ(){
  if(ctx.pos>=ctx.queue.length) return renderResults();
  ctx.locked=false; clearFoot();
  const qi=ctx.queue[ctx.pos], q=BANK[qi];

    progress:ctx.pos/ctx.queue.length*100, bulletText:String(q.el),
    star:function(){return !!S.starQ[qi];},
    toggleStar:function(){ if(S.starQ[qi]) delete S.starQ[qi]; else S.starQ[qi]=1; save(); }});
  app.innerHTML=
  '<div class="cols"><div class="colA"><div class="block">'+
    '<div class="head">'+bul(q.el,LINES[q.el][0],LINES[q.el][1])+'<span class="sys soft">'+q.cite+'</span></div>'+

function answerDrill(oi,btn){
  if(ctx.locked) return; ctx.locked=true;
  const qi=ctx.queue[ctx.pos], q=BANK[qi], right=(oi===q.a);
  ctx.results.push(right);
  if(right){ ctx.streak++; ctx.best=Math.max(ctx.best,ctx.streak); } else ctx.streak=0;
  recordQ(q.el,right,qi); haptic(right?"ok":"no"); announce(right?"Correct":"Incorrect. "+q.o[q.a]);
  bFill.style.width=((ctx.pos+1)/ctx.queue.length*100)+"%";
  app.querySelectorAll(".opt").forEach(function(b){
    b.disabled=true; const i=+b.dataset.oi;
    if(i===q.a) b.classList.add("is-right");
    else if(b===btn) b.classList.add("is-wrong");
    else b.classList.add("mute");
  });
  document.getElementById("verdict").innerHTML=
  '<div class="block verdict"><span class="flag '+(right?"ok":"warn")+'">'+
  (right?("Correct"+(ctx.streak>=3?" \u00b7 "+ctx.streak+" in a row":"")):"Incorrect")+'</span>'+
  (right?"":'<p class="ansline">'+q.o[q.a]+'</p>')+'<p>'+q.why+'</p></div>';
  const last=(ctx.pos+1===ctx.queue.length);

       (last?"":'<button class="alt" id="quit">Stop</button>'));
  document.getElementById("next").addEventListener("click",function(){ ctx.pos++; renderQ(); toTop(); });
  const qb=document.getElementById("quit");
  if(qb) qb.addEventListener("click",function(){ ctx.queue=ctx.queue.slice(0,ctx.results.length); renderResults(); toTop(); });
}
function elTable(pairs,clickable){
  return '<table class="scoretable">'+Object.keys(pairs).sort(function(a,b){return a-b;}).map(function(el){
    const o=pairs[el], p=Math.round(o.c/o.t*100), low=p<60, high=p>=80;
    const fill=low?"var(--warn)":LINES[el][0];
    return '<tr class="'+(clickable?"clickable":"")+'" data-el="'+el+'"><td class="b">'+bul(el,LINES[el][0],LINES[el][1],"sm")+'</td>'+
      '<td class="nm">'+LINES[el][2]+'<div class="meter"><i style="width:'+Math.max(p,2)+'%;background:'+fill+'"></i></div></td>'+
      '<td class="v '+(low?"low":(high?"high":""))+'">'+o.c+'/'+o.t+'</td></tr>';
  }).join("")+'</table>';
}
function renderResults(){
  view="drillres"; running(false); split(false); clearFoot();

  ctx.results.forEach(function(r,i){ const el=BANK[ctx.queue[i]].el; byEl[el]=byEl[el]||{c:0,t:0}; byEl[el].t++; if(r) byEl[el].c++; });
  const wrong=ctx.results.map(function(r,i){return r?null:ctx.queue[i];}).filter(function(v){return v!==null;});
  let line;
  if(pct>=85) line="Exam-ready territory. Keep the weakest element from drifting.";
  else if(pct>=70) line="Pass range on a good day. Tighten the elements marked red.";
  else if(pct>=55) line="The shape is right, the detail is not there yet.";
  else line="Go back to the course chapters behind your red elements. Faster than repeating the paper.";
  app.innerHTML=
  '<div class="block"><p class="sys soft" style="margin-bottom:10px">Result</p><p class="pct">'+pct+'%</p>'+
  '<p class="sys soft" style="margin-top:10px">'+correct+' of '+total+' correct'+(ctx.best>2?' \u00b7 longest run '+ctx.best:'')+'</p></div>'+
  '<div class="block"><p>'+line+'</p></div>'+
  '<div class="block"><p class="sys soft" style="margin-bottom:8px">By element \u00b7 tap a row to study that chapter</p>'+elTable(byEl,true)+'</div>'+
  '<div class="block row2">'+(wrong.length?'<button class="btn" id="redo">Retake the '+wrong.length+' missed</button>':'')+
  '<button class="btn alt" id="menu">Drill menu</button><button class="btn alt" id="home">Home</button></div>';
  const rd=document.getElementById("redo");
  if(rd) rd.addEventListener("click",function(){ ctx.queue=wrong; beginDrill(); });
  document.getElementById("menu").addEventListener("click",function(){ renderDrillStart(); toTop(); });
  document.getElementById("home").addEventListener("click",function(){ renderHome(); toTop(); });
  app.querySelectorAll("tr.clickable").forEach(function(tr){
    tr.addEventListener("click",function(){ ctx.li=chStart[EL2CH[+tr.dataset.el]]; renderLesson(); toTop(); });
  });
  toTop();
}

function beginSpeed(){ ctx.pos=0; ctx.results=[]; ctx.streak=0; ctx.best=0; ctx.score=0;
  view="speedrun"; running(true); split(true); renderSpeed(); toTop(); }
function renderSpeed(){
  if(ctx.pos>=ctx.queue.length) return renderSpeedResults();
  ctx.locked=false; clearFoot();
  const qi=ctx.queue[ctx.pos], q=BANK[qi], order=shuffle([0,1,2,3]);
  setLine(LINES[q.el][0],LINES[q.el][1]);
  chrome({title:"E"+q.el+" \u00b7 "+ctx.score.toLocaleString()+" pts", count:(ctx.pos+1)+" / "+ctx.queue.length,
    progress:ctx.pos/ctx.queue.length*100, bulletText:String(q.el)});
  app.innerHTML=
  '<div class="block tight" style="display:flex;justify-content:space-between;align-items:center">'+
    '<span class="pct" style="font-size:1.6em">'+ctx.score.toLocaleString()+'</span>'+
    '<span class="sys soft">'+(ctx.streak>=2?ctx.streak+" in a row":"Points")+'</span>'+
    (S.set.speedClock?'<span class="pct" style="font-size:1.6em" id="secs">'+ctx.secs+'</span>':'')+
  '</div>'+
  '<div class="cols"><div class="colA"><div class="block"><p class="q">'+q.q+'</p>'+
  '<p class="sys soft kbd" style="margin-top:10px">Press 1\u20134</p></div></div>'+
  '<div class="colB"><div class="block" style="border-bottom:0">'+
  order.map(function(oi,i){
    return '<button class="opt" data-oi="'+oi+'" style="min-height:64px"><span class="k">'+SHAPES[i]+'</span><span>'+q.o[oi]+'</span></button>';
  }).join("")+'</div><div id="verdict"></div></div></div>';
  app.querySelectorAll(".opt").forEach(function(b){
    b.addEventListener("click",function(){ answerSpeed(+b.dataset.oi,b); });
  });
  if(S.set.speedClock){
    clock.style.display="block"; clockFill.className=""; clockFill.style.width="100%";
    ctx.left=ctx.secs*10;
    if(timer) clearInterval(timer);
    timer=setInterval(function(){
      ctx.left--;
      const f=Math.max(ctx.left,0)/(ctx.secs*10);
      clockFill.style.width=(f*100)+"%";
      const s=document.getElementById("secs"); if(s) s.textContent=Math.ceil(Math.max(ctx.left,0)/10);
      if(f<=0.25) clockFill.className="low";
      if(ctx.left<=0){ clearInterval(timer); timer=null; answerSpeed(-1,null); }
    },100);
  } else { ctx.left=0; stopTimer(); }
}
function answerSpeed(oi,btn){
  if(ctx.locked) return; ctx.locked=true;
  if(timer){clearInterval(timer);timer=null;}
  const qi=ctx.queue[ctx.pos], q=BANK[qi], right=(oi===q.a), out=(oi===-1);
  ctx.results.push(right); recordQ(q.el,right,qi); haptic(right?"ok":"no");
  let gain=0, speedPts=0, bonus=0;
  if(right){
    ctx.streak++; ctx.best=Math.max(ctx.best,ctx.streak);
    speedPts=S.set.speedClock?Math.round(500*Math.max(ctx.left,0)/(ctx.secs*10)):0;
    bonus=ctx.streak>=3?Math.min((ctx.streak-2)*100,500):0;
    gain=500+speedPts+bonus; ctx.score+=gain;
  } else ctx.streak=0;
  app.querySelectorAll(".opt").forEach(function(b){
    b.disabled=true; const i=+b.dataset.oi;
    if(i===q.a) b.classList.add("is-right");
    else if(b===btn) b.classList.add("is-wrong");
    else b.classList.add("mute");
  });
  document.getElementById("verdict").innerHTML=
  '<div class="block verdict"><span class="flag '+(right?"ok":"warn")+'">'+(out?"Out of time":(right?"Correct":"Incorrect"))+'</span>'+
  (right?'<p class="pct" style="font-size:2.2em">+'+gain.toLocaleString()+'</p><p class="sys soft" style="margin:8px 0 10px">500 base'+
    (speedPts?' \u00b7 '+speedPts+' speed':'')+(bonus?' \u00b7 '+bonus+' streak':'')+'</p>'
   :'<p class="ansline">'+q.o[q.a]+'</p>')+'<p>'+q.why+'</p></div>';
  const last=(ctx.pos+1===ctx.queue.length);
  foot('<button id="next">'+(last?"Final score":"Next")+'<span class="arrow">&#8594;</span></button>'+
       (last?"":'<button class="alt" id="quit">Stop</button>'));
  document.getElementById("next").addEventListener("click",function(){ ctx.pos++; renderSpeed(); toTop(); });
  const qb=document.getElementById("quit");
  if(qb) qb.addEventListener("click",function(){ ctx.queue=ctx.queue.slice(0,ctx.results.length); renderSpeedResults(); toTop(); });
}
function renderSpeedResults(){
  view="speedres"; running(false); split(false); stopTimer(); clearFoot();
  neutral();
  chrome({title:"Speed round"});
  const total=ctx.results.length, correct=ctx.results.filter(Boolean).length;

  app.innerHTML=
  '<div class="block"><p class="sys soft" style="margin-bottom:10px">Final score</p><p class="pct">'+ctx.score.toLocaleString()+'</p></div>'+
  '<div class="statrow"><div><b>'+correct+'/'+total+'</b><span class="sys soft">Correct</span></div>'+
  '<div><b>'+pct+'%</b><span class="sys soft">Accuracy</span></div>'+
  '<div><b>'+ctx.best+'</b><span class="sys soft">Best streak</span></div></div>'+

  '<div class="block row2"><button class="btn" id="again">Run it again</button>'+
  '<button class="btn alt" id="menu">Speed menu</button><button class="btn alt" id="home">Home</button></div>';

  document.getElementById("menu").addEventListener("click",function(){ renderSpeedStart(); toTop(); });
  document.getElementById("home").addEventListener("click",function(){ renderHome(); toTop(); });

function beginExam(){
  view="examrun"; running(true); split(true);
  if(S.set.examClock){
    clock.style.display="block"; clockFill.className=""; clockFill.style.width="100%";
    if(timer) clearInterval(timer);
    timer=setInterval(function(){
      ctx.left--;
      const f=Math.max(ctx.left,0)/ctx.total;
      clockFill.style.width=(f*100)+"%";
      if(f<=0.15) clockFill.className="low";
      const t=document.getElementById("examclock");
      if(t) t.textContent=fmtTime(ctx.left);
      if(ctx.left<=0){ clearInterval(timer); timer=null; renderExamResults(true); }
    },1000);
  }
  renderExamQ(); toTop();
}
function fmtTime(s){ s=Math.max(s,0); const m=Math.floor(s/60); return m+":"+String(s%60).padStart(2,"0"); }
function renderExamQ(){
  const qi=ctx.queue[ctx.pos], q=BANK[qi];
  if(!ctx.order[ctx.pos]) ctx.order[ctx.pos]=S.set.shuffle?shuffle([0,1,2,3]):[0,1,2,3];
  const order=ctx.order[ctx.pos];
  setLine(LINES[q.el][0],LINES[q.el][1]);

    progress:answered/ctx.queue.length*100, bulletText:String(q.el)});

    return '<li><button class="opt'+(ctx.ans[ctx.pos]===oi?" chosen":"")+'" data-oi="'+oi+'"><span class="k">'+KEYS[i]+'</span><span>'+q.o[oi]+'</span></button></li>';
  }).join("")+'</ul>'+
  '<div class="block"><p class="sys soft" style="margin-bottom:10px">Question navigator</p><div class="grid" id="grid"></div></div>'+
  '</div></div>';

    b.addEventListener("click",function(){
      ctx.ans[ctx.pos]=+b.dataset.oi;

  grid.innerHTML=ctx.queue.map(function(_,i){
    const el=BANK[ctx.queue[i]].el;

    return '<button data-i="'+i+'"'+st+' class="'+(ctx.ans[i]>=0?"ans ":"")+(ctx.flags[i]?"flag ":"")+(i===ctx.pos?"now":"")+'">'+(i+1)+'</button>';
  }).join("");

       '<button class="alt" id="prev">Back</button>'+
       '<button class="alt" id="sub">Submit</button>');

    ctx.pos=Math.min(ctx.pos+1,ctx.queue.length-1); renderExamQ(); toTop(); });
  document.getElementById("prev").addEventListener("click",function(){
    ctx.pos=Math.max(ctx.pos-1,0); renderExamQ(); toTop(); });
  document.getElementById("sub").addEventListener("click",function(){
    const un=ctx.ans.filter(function(a){return a<0;}).length;

    else renderExamResults(false);

function renderExamResults(timedOut){

/* ================= GLOSSARY ================= */
function renderGlossary(){
  view="glossary"; running(false); split(false); stopTimer(); clearFoot();
  neutral();
  chrome({title:"Glossary"});
  app.innerHTML='<div class="block"><input type="text" id="gq" placeholder="Search a term, e.g. margin, PEP, UMIR" autocomplete="off"></div><div id="glist"></div>';
  const list=document.getElementById("glist"), input=document.getElementById("gq");
  function draw(f){
    f=(f||"").toLowerCase();
    const items=LESSONS.map(function(L,i){return {L:L,i:i};})
      .filter(function(o){ return !f || (o.L.term+" "+o.L.t+" "+strip(o.L.teach)).toLowerCase().indexOf(f)>=0; })
      .sort(function(a,b){ return a.L.term.localeCompare(b.L.term); });
    list.innerHTML=items.length?items.map(function(o){
      return '<button class="gitem" data-i="'+o.i+'">'+bul(o.L.ch,CH[o.L.ch][0],CH[o.L.ch][1],"sm")+
      '<span class="gt"><strong>'+o.L.term+'</strong><span>'+firstSent(o.L.teach,1)+'</span></span></button>';
    }).join(""):'<div class="block"><p>Nothing matches that.</p></div>';
    list.querySelectorAll("[data-i]").forEach(function(b){
      b.addEventListener("click",function(){ ctx.li=+b.dataset.i; renderLesson(); toTop(); });});
  }
  draw("");
  input.addEventListener("input",function(){ draw(input.value); });
}

/* ================= SETTINGS ================= */
function renderSettings(){
  view="settings"; running(false); split(false); stopTimer(); clearFoot();
  neutral();
  chrome({title:"Settings"});
  app.innerHTML=
  '<div class="block"><p class="sys soft" style="margin-bottom:10px">Text size</p>'+
  '<div class="seg" id="ts">'+[["0","Small"],["1","Normal"],["2","Large"],["3","Largest"]].map(function(o){
    return '<button data-ts="'+o[0]+'" class="'+(S.set.ts==+o[0]?"on":"")+'">'+o[1]+'</button>';}).join("")+'</div></div>'+
  '<div class="block">'+
  '<label class="tog"><input type="checkbox" id="dark" '+(S.set.dark?"checked":"")+'><span class="sys">Dark mode</span></label>'+
  '<label class="tog"><input type="checkbox" id="shuf" '+(S.set.shuffle?"checked":"")+'><span class="sys">Shuffle the answer order</span></label>'+
  '<label class="tog"><input type="checkbox" id="sclk" '+(S.set.speedClock?"checked":"")+'><span class="sys">Clock in the speed round</span></label>'+
  '<label class="tog"><input type="checkbox" id="eclk" '+(S.set.examClock?"checked":"")+'><span class="sys">Clock in the mock exam</span></label></div>'+
  '<div class="block"><p class="sys soft" style="margin-bottom:8px">Keyboard</p>'+
  '<p style="font-size:.95em;line-height:1.6">1\u20134 or A\u2013D answer \u00b7 Enter or Space continues \u00b7 Space flips a flashcard \u00b7 Esc goes back \u00b7 H returns home</p></div>'+
  '<div class="block"><p class="sys soft" style="margin-bottom:8px">Your data</p>'+
  '<p style="font-size:.95em;line-height:1.5">Progress is saved on this device only. Nothing leaves it.</p>'+
  '<button class="btn alt" id="reset" style="margin-top:12px">Erase all progress</button></div>';
  document.querySelectorAll("[data-ts]").forEach(function(b){
    b.addEventListener("click",function(){ S.set.ts=+b.dataset.ts; applySettings(); save(); renderSettings(); });});
  document.getElementById("dark").addEventListener("change",function(e){ S.set.dark=e.target.checked; applySettings(); save(); renderSettings(); });
  document.getElementById("shuf").addEventListener("change",function(e){ S.set.shuffle=e.target.checked; save(); });
  document.getElementById("sclk").addEventListener("change",function(e){ S.set.speedClock=e.target.checked; save(); });
  document.getElementById("eclk").addEventListener("change",function(e){ S.set.examClock=e.target.checked; save(); });
  document.getElementById("reset").addEventListener("click",function(){
    toast("Erase all progress, marks, bookmarks and statistics?","Erase everything",function(){
      S.lessonDone={}; S.starLesson={}; S.starQ={}; S.qStats={}; S.mistakes={}; S.cardKnown={}; S.srs={}; S.lastLesson=0;
      save(); renderSettings(); toast("Everything erased");
    });
  });
}

/* ================= PRINTABLE NOTES ================= */
function renderPrintable(){
  view="map"; running(false); split(false); clearFoot();
  chrome({title:"Revision notes"});
  app.innerHTML=LESSONS.map(function(L){
    return '<div class="block"><p class="sys soft">Chapter '+L.ch+' \u00b7 '+L.term+'</p>'+
      '<h3 class="lesson-t" style="font-size:1.1em;margin:6px 0 8px">'+L.t+'</h3>'+
      '<div class="teach">'+L.teach+'</div></div>';
  }).join("")+'<div class="block row2 noprint"><button class="btn" id="doprint">Print</button>'+
  '<button class="btn alt" id="back">Back to the map</button></div>';
  document.getElementById("doprint").addEventListener("click",function(){
    try{ window.print(); }
    catch(e){ toast("Printing is blocked here \u2014 use your browser's own print command"); }
  });
  document.getElementById("back").addEventListener("click",function(){ renderMap(); toTop(); });
  toTop();
}

/* ================= KEYBOARD ================= */
document.addEventListener("keydown",function(e){
  if(e.target && /INPUT|TEXTAREA|SELECT/.test(e.target.tagName)) return;
  const k=e.key;
  if(k==="Escape"){ e.preventDefault(); goBack(); return; }
  if((k==="h"||k==="H") && view!=="glossary"){ e.preventDefault(); stopTimer(); renderHome(); toTop(); return; }
  if(k==="Enter"||k===" "){
    if(view==="cardrun"){ e.preventDefault(); if(ctx.flipped) throwCard(2); else flipCard(); return; }
    const n=document.getElementById("next")||document.getElementById("go");
    if(n){ e.preventDefault(); n.click(); }
    return;
  }
  if(view==="cardrun"){
    if(!ctx.flipped){ if(k>="1"&&k<="4"){ e.preventDefault(); flipCard(); return; } }
    else if(k>="1"&&k<="4"){ e.preventDefault(); throwCard(+k-1); return; }
  }
  let idx=-1;
  if(k>="1"&&k<="4") idx=+k-1;
  const up=(k||"").toUpperCase();
  if(up.length===1 && up>="A" && up<="D") idx="ABCD".indexOf(up);
  if(idx<0) return;
  const picks=app.querySelectorAll(".opt:not(:disabled)");
  if(picks.length===4){ e.preventDefault(); picks[idx].click(); }
});
bBack.addEventListener("click",goBack);

/* ================= BOOT ================= */
load().then(function(){ normalise(); applySettings(); renderHome(); });
</script>
