<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#000000">
<title>CIRE — course, flashcards and exam drill</title>
<style>
/* ------------------------------------------------------------------
   After Unimark International's NYCTA Graphics Standards Manual
   (Vignelli / Noorda, 1970). One typeface, two weights, a modular grid,
   colour reserved for line identity, red reserved for warnings, arrows
   for direction. Dark mode is the 1973 white-on-black revision.
   ------------------------------------------------------------------ */
:root{
  --bg:#FFFFFF; --fg:#111111; --hair:#111111; --soft:#6B6B6B;
  --panel:#F4F4F4; --dim:#D6D6D6;
  --warn:#EE352E; --ok:#00733D;
  --line:#000000; --lineink:#FFFFFF;
  --bar:calc(58px + env(safe-area-inset-bottom));
  --side:250px;
  --ease:cubic-bezier(.2,.7,.3,1);
  --fast:120ms; --med:200ms;
}
body.dark{
  --bg:#0A0A0A; --fg:#F2F2F2; --hair:#F2F2F2; --soft:#9C9C9C;
  --panel:#151515; --dim:#3A3A3A; --warn:#FF6B62; --ok:#3FBF7A;
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent;margin:0;padding:0;}
html{-webkit-text-size-adjust:100%;background:var(--bg);}
body{
  overflow-x:hidden;
  background:var(--bg); color:var(--fg);
  font-family:"Helvetica Neue",Helvetica,Arial,"Liberation Sans",sans-serif;
  font-weight:400; font-size:16px; line-height:1.45;
  -webkit-font-smoothing:antialiased; overscroll-behavior-y:none;
}
body.ts0{font-size:15px;} body.ts2{font-size:17.5px;} body.ts3{font-size:19px;}
button{font:inherit;color:inherit;background:none;border:0;cursor:pointer;}
/* long acronyms (PCMLTFA, NI 45-106) must never push a container open */
p,li,td,th,strong,b,em,span,div,h1,h2,h3{overflow-wrap:break-word;}
.term,.q,.lesson-t,.plate .t strong,.chband .t strong{overflow-wrap:break-word;hyphens:auto;}

/* ---------- shell ---------- */
.shell{display:block;}
.side{display:none;}
.main{min-height:100vh;}
.pane{max-width:660px;margin:0 auto;}
body.split .pane{max-width:660px;}

/* ---------- system type ---------- */
.sys{font-size:11px;font-weight:500;letter-spacing:.09em;text-transform:uppercase;line-height:1.3;}
.soft{color:var(--soft);}
.bullet{
  display:inline-grid;place-items:center;flex:0 0 auto;
  width:26px;height:26px;border-radius:50%;
  background:var(--line);color:var(--lineink);
  font-size:14px;font-weight:500;line-height:1;padding-bottom:1px;
}
.bullet.lg{width:38px;height:38px;font-size:19px;}
.bullet.sm{width:21px;height:21px;font-size:12px;}

/* ---------- top band (mobile) ---------- */
.band{
  position:sticky;top:0;z-index:30;background:var(--line);color:var(--lineink);
  padding:calc(7px + env(safe-area-inset-top)) 8px 7px;transition:background .25s;
}
.band .row{display:flex;align-items:center;gap:6px;min-width:0;}
.band .name{flex:1 1 auto;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
  font-size:11.5px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;}
@media (max-width:380px){ .band .name{font-size:11px;letter-spacing:.03em;} }
.band .count{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.05em;padding:0 4px;opacity:.9;}
.bandbtn{
  min-width:42px;height:40px;display:grid;place-items:center;color:inherit;
  font-size:19px;line-height:1;border:0;border-radius:2px;
  transition:background var(--fast) var(--ease);
}
.bandbtn:active{background:rgba(255,255,255,.22);}
@media (hover:hover){ .bandbtn:hover{background:rgba(255,255,255,.16);} }
body.dark .bandbtn:active{background:rgba(0,0,0,.28);}
.stripe{height:2px;background:rgba(127,127,127,.5);margin-top:7px;}
.stripe i{display:block;height:100%;background:currentColor;width:0;transition:width .25s linear;}
.clock{height:8px;background:var(--dim);position:sticky;z-index:29;top:0;}
.clock i{display:block;height:100%;background:var(--fg);width:100%;}
.clock i.low{background:var(--warn);}

/* ---------- blocks ---------- */
.block{padding:20px 16px;border-bottom:1px solid var(--hair);}
.block.tight{padding-top:14px;padding-bottom:14px;}
.head{display:flex;align-items:center;gap:10px;margin-bottom:12px;}
.head .sys{flex:1;min-width:0;}
.teach{font-size:1.03em;line-height:1.55;}
.teach b{font-weight:500;border-bottom:2px solid var(--line);}
.q{font-size:clamp(1.08em,4.6vw,1.25em);font-weight:500;line-height:1.28;letter-spacing:-.012em;}
.lesson-t{font-size:clamp(1.3em,5.6vw,1.55em);font-weight:500;line-height:1.15;letter-spacing:-.02em;margin-bottom:14px;}
.eg{background:var(--panel);padding:14px;margin-top:18px;font-size:.95em;line-height:1.45;}
.eg .sys{margin-bottom:6px;}

/* ---------- options ---------- */
.opts{list-style:none;}
.opt{
  display:flex;gap:12px;align-items:flex-start;width:100%;text-align:left;
  min-height:56px;background:var(--bg);border:1px solid var(--hair);
  padding:14px;font-size:1em;line-height:1.35;position:relative;margin-top:-1px;
}
.opt{transition:background var(--fast) var(--ease),border-color var(--fast) var(--ease),transform var(--fast) var(--ease);}
.opt:active:not(:disabled){background:var(--panel);transform:scale(.995);}
@media (hover:hover){ .opt:hover:not(:disabled){background:var(--panel);} }
.opt:focus-visible{outline:3px solid var(--line);outline-offset:-3px;}
.opt .k{width:24px;height:24px;flex:0 0 auto;display:grid;place-items:center;
  border:1px solid var(--hair);font-size:12px;font-weight:500;line-height:1;}
.opt.is-right{border-width:2px;border-color:var(--ok);}
.opt.is-right .k{background:var(--ok);color:#fff;border-color:var(--ok);}
.opt.is-wrong{border-color:var(--warn);border-width:2px;color:var(--warn);}
.opt.is-wrong .k{background:var(--warn);color:#fff;border-color:var(--warn);}
.opt.chosen{border-width:2px;}
.opt.chosen .k{background:var(--fg);color:var(--bg);}
.opt.mute{color:var(--soft);border-color:var(--dim);}
.opt.mute .k{border-color:var(--dim);color:var(--soft);}
.opt:disabled{cursor:default;}

/* ---------- verdict ---------- */
@media (prefers-reduced-motion:no-preference){
  #app.enter{animation:enter 220ms var(--ease);}
  @keyframes enter{from{opacity:0;transform:translateY(5px);}to{opacity:1;transform:none;}}
  .verdict{animation:rise 240ms var(--ease);}
  @keyframes rise{from{opacity:0;transform:translateY(6px);}to{opacity:1;transform:none;}}
  .opt.is-right{animation:settle 260ms var(--ease);}
  @keyframes settle{0%{transform:scale(1);}45%{transform:scale(1.012);}100%{transform:scale(1);}}
  .slot{animation:deal 260ms var(--ease);}
  @keyframes deal{from{opacity:0;transform:translateY(14px) scale(.98);}to{opacity:inherit;}}
}
.flag{display:inline-block;padding:5px 9px;margin-bottom:12px;background:var(--fg);color:var(--bg);
  font-size:11px;font-weight:500;letter-spacing:.1em;text-transform:uppercase;}
.flag.warn{background:var(--warn);color:#fff;}
.flag.ok{background:var(--ok);color:#fff;}
.verdict p + p{margin-top:10px;}
.ansline{font-weight:500;}

/* ---------- plates ---------- */
.plate{
  display:flex;align-items:center;gap:12px;width:100%;text-align:left;
  border-bottom:1px solid var(--hair);padding:16px;min-height:70px;
}
.plate{transition:background var(--fast) var(--ease);}
.plate:active{background:var(--panel);}
@media (hover:hover){ .plate:hover{background:var(--panel);} }
.plate:focus-visible,.chband:focus-visible,.gitem:focus-visible,.cardnav button:focus-visible,.grid button:focus-visible{outline:3px solid var(--line);outline-offset:-3px;}
.plate .t{flex:1 1 auto;min-width:0;}
.plate .t strong{display:block;font-size:1.06em;font-weight:500;line-height:1.2;}
.plate .t span{display:block;font-size:.9em;color:var(--soft);margin-top:3px;line-height:1.35;}
.plate .n{font-size:12px;font-weight:500;letter-spacing:.06em;font-variant-numeric:tabular-nums;white-space:nowrap;}
/* chapter band: a full-width colour panel, in the manner of a station sign */
.chband{
  display:flex;align-items:center;gap:14px;width:100%;text-align:left;
  background:var(--line);color:var(--lineink);padding:16px;min-height:70px;
  transition:filter var(--fast) var(--ease);
}
.chband:hover{filter:brightness(1.08);}
.chband:active{filter:brightness(.94);}
.chband .num{font-size:1.55em;font-weight:500;line-height:1;font-variant-numeric:tabular-nums;min-width:26px;}
.chband .t{flex:1 1 auto;min-width:0;}
.chband .t strong{display:block;font-size:1.02em;font-weight:500;line-height:1.2;}
.chband .n{font-size:12px;font-weight:500;font-variant-numeric:tabular-nums;letter-spacing:.05em;}
.chband .chip i{background:rgba(255,255,255,.34);}
.chband .chip i.on{background:currentColor;}
.chip{display:flex;gap:3px;margin-top:7px;}
.chip i{flex:1;height:4px;background:var(--dim);display:block;max-width:26px;}
.chip i.on{background:var(--fg);}

/* ---------- bottom action band ---------- */
.foot-band{position:fixed;left:0;right:0;bottom:0;z-index:40;display:none;border-top:1px solid var(--hair);}
.foot-band.on{display:flex;}
.foot-band button{
  font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  min-height:var(--bar);padding:0 14px calc(env(safe-area-inset-bottom));
  background:var(--fg);color:var(--bg);display:flex;align-items:center;justify-content:center;gap:10px;flex:1;
}
.foot-band button.alt{flex:0 0 34%;background:var(--bg);color:var(--fg);border-left:1px solid var(--hair);}
.foot-band button{transition:opacity var(--fast) var(--ease);}
.foot-band button:active{opacity:.85;}
@media (hover:hover){ .foot-band button:hover{opacity:.92;} }
.arrow{font-size:19px;line-height:1;font-weight:400;}
body.running .pane{padding-bottom:calc(var(--bar) + 8px);}

/* ---------- controls ---------- */
.btn{font-size:15px;font-weight:500;letter-spacing:.06em;text-transform:uppercase;
  background:var(--fg);color:var(--bg);border:1px solid var(--hair);min-height:52px;padding:0 20px;width:100%;}
.btn.alt{background:var(--bg);color:var(--fg);}
.btn{transition:opacity var(--fast) var(--ease),transform var(--fast) var(--ease);}
.btn:active{opacity:.85;transform:scale(.99);}
@media (hover:hover){ .btn:hover{opacity:.9;} }
.btn:focus-visible{outline:3px solid var(--line);outline-offset:2px;}
.row2{display:grid;gap:10px;}
select{font:inherit;font-size:1em;width:100%;min-height:52px;padding:12px;
  border:1px solid var(--hair);border-radius:0;background:var(--bg);color:var(--fg);appearance:none;}
input[type=text]{font:inherit;font-size:1em;width:100%;min-height:52px;padding:12px;
  border:1px solid var(--hair);border-radius:0;background:var(--bg);color:var(--fg);}
.tog{display:flex;align-items:center;gap:12px;padding:10px 0;cursor:pointer;}
.tog input{width:20px;height:20px;accent-color:var(--fg);}
.seg{display:flex;border:1px solid var(--hair);}
.seg button{flex:1;min-height:46px;font-size:12px;font-weight:500;letter-spacing:.08em;
  text-transform:uppercase;border-right:1px solid var(--hair);}
.seg button:last-child{border-right:0;}
.seg button.on{background:var(--fg);color:var(--bg);}

/* ---------- flashcards ---------- */
/* ---------- flashcard stage: a real deck ----------
   perspective on the stage, preserve-3d on the flipper, backface hidden on
   both faces. The thrower handles drag translation/rotation so the two
   transforms never fight each other. */
.stage{position:relative;padding:20px 16px 0;perspective:1600px;perspective-origin:50% 42%;}
.stack{position:relative;min-height:clamp(220px,34vh,300px);margin-bottom:22px;display:grid;}
.slot{position:absolute;inset:0;border:1px solid var(--hair);background:var(--bg);z-index:0;}
.slot.b1{transform:translateY(11px) scale(.955);opacity:.4;}
.slot.b2{transform:translateY(21px) scale(.912);opacity:.18;}
.thrower{position:relative;grid-area:1/1;z-index:2;pointer-events:none;will-change:transform;}
/* the drag surface is a plain, untransformed layer: hit-testing through a
   preserve-3d subtree with a mirrored face is unreliable, so nothing that
   listens for pointers is allowed to be inside the rotating card */
.dragzone{
  position:absolute;inset:0;z-index:3;touch-action:none;cursor:pointer;
  background:transparent;
}
.dragzone.grabbing{cursor:grabbing;}

.thrower.settle{transition:transform 420ms cubic-bezier(.2,1.2,.4,1);}
.thrower.fling{transition:transform 300ms cubic-bezier(.4,0,.9,.5),opacity 300ms linear;}
.flipper{
  position:relative;display:grid;transform-style:preserve-3d;min-height:100%;
  transition:transform 560ms cubic-bezier(.16,.9,.24,1);
}
.flipper.flipped{transform:rotateY(180deg);}
.face{
  grid-area:1/1;position:relative;backface-visibility:hidden;-webkit-backface-visibility:hidden;
  background:var(--bg);border:1px solid var(--hair);
  display:flex;flex-direction:column;padding:18px 20px;min-width:0;
}
.face.front{transform:rotateY(0deg);}
.face.back{transform:rotateY(180deg);}
.face .fhead{display:flex;justify-content:space-between;align-items:center;gap:10px;flex:0 0 auto;}
.face .fbody{flex:1;display:flex;flex-direction:column;justify-content:center;min-width:0;padding:16px 0;}
.face .term{font-size:clamp(1.55em,6.4vw,2.15em);font-weight:500;letter-spacing:-.025em;line-height:1.08;text-wrap:balance;}
.face .def{font-size:clamp(.95em,3.6vw,1.02em);line-height:1.5;}
.face .eg2{font-size:.88em;line-height:1.45;color:var(--soft);margin-top:12px;}
.face .foot{flex:0 0 auto;padding-top:10px;}
@media (prefers-reduced-motion:no-preference){
  .thrower.lift{animation:lift 560ms cubic-bezier(.16,.9,.24,1);}
  @keyframes lift{0%{transform:scale(1);}42%{transform:scale(1.045);}100%{transform:scale(1);}}
}
/* drag verdict labels, revealed by the drag itself */
.swipetag{
  position:absolute;top:50%;transform:translateY(-50%);z-index:5;pointer-events:none;
  font-size:13px;font-weight:500;letter-spacing:.12em;text-transform:uppercase;
  padding:8px 12px;opacity:0;color:#fff;
}
.swipetag.l{left:24px;background:var(--warn);}
.swipetag.r{right:24px;background:var(--ok);}
.swipetag.u{left:50%;top:22px;transform:translateX(-50%);background:var(--fg);color:var(--bg);}
.swipetag.d{left:50%;top:auto;bottom:22px;transform:translateX(-50%);background:var(--soft);}
.stagehint{text-align:center;padding:0 16px;min-height:1.3em;}
.tapcard{cursor:pointer;}
/* grading bar: dormant until the card is revealed, then it rises into place */
.cardnav{
  display:grid;grid-template-columns:repeat(4,1fr);
  border-top:1px solid var(--hair);border-bottom:1px solid var(--hair);
  margin-top:18px;
  opacity:0;pointer-events:none;transform:translateY(10px);
  transition:opacity 260ms var(--ease),transform 260ms var(--ease);
}
.cardnav.live{opacity:1;pointer-events:auto;transform:none;}
.cardnav button{
  min-height:74px;border-right:1px solid var(--hair);
  display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5px;
  transition:background var(--fast) var(--ease);
}
.cardnav button:last-child{border-right:0;}
.cardnav button:active{background:var(--panel);}
@media (hover:hover){ .cardnav button:hover{background:var(--panel);} }
.cardnav b{
  font-size:12.5px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;line-height:1;
}
.cardnav em{
  font-style:normal;font-size:11px;line-height:1;color:var(--soft);
  font-variant-numeric:tabular-nums;letter-spacing:.04em;
}
.cardnav button.g0 b{color:var(--warn);}
.cardnav button.g3 b{color:var(--ok);}
.deckstat{display:flex;border-bottom:1px solid var(--hair);}
.deckstat div{flex:1 1 0;min-width:0;padding:14px 12px;border-right:1px solid var(--hair);}
.deckstat div:last-child{border-right:0;}
.deckstat b{display:block;font-size:clamp(1.15em,5.4vw,1.45em);font-weight:500;font-variant-numeric:tabular-nums;line-height:1.1;}
.deckstat.due b{color:var(--line);}

/* ---------- tables, meters, stats ---------- */
.pct{font-size:clamp(2.4em,12vw,3.5em);font-weight:500;line-height:.9;letter-spacing:-.03em;font-variant-numeric:tabular-nums;}
.scoretable{width:100%;border-collapse:collapse;}
.scoretable td{padding:9px 0;border-bottom:1px solid var(--dim);vertical-align:middle;}
.scoretable td.b{width:34px;} .scoretable td.nm{font-size:.9em;min-width:0;padding-right:8px;}
.scoretable td.v{width:58px;text-align:right;font-size:.82em;font-weight:500;font-variant-numeric:tabular-nums;}
.scoretable td.v.low{color:var(--warn);}
.scoretable td.v.high{color:var(--ok);}
.scoretable tr.clickable{cursor:pointer;}
.meter{height:6px;background:var(--dim);margin-top:5px;}
.meter i{display:block;height:100%;background:var(--line);}
.meter i.low{background:var(--warn);}
.chmeter{display:flex;gap:3px;height:12px;}
.chmeter i{flex:1;display:block;background:var(--dim);position:relative;overflow:hidden;}
.chmeter i b{position:absolute;left:0;top:0;bottom:0;display:block;}
.statrow{display:flex;border-top:1px solid var(--hair);}
.statrow div{flex:1 1 0;min-width:0;padding:14px 12px;border-right:1px solid var(--hair);}
.statrow div:last-child{border-right:0;}
.statrow b{display:block;font-size:clamp(1.15em,5.4vw,1.55em);font-weight:500;letter-spacing:-.02em;font-variant-numeric:tabular-nums;}
.termtag{display:inline-flex;align-items:center;gap:8px;border:1px solid var(--hair);
  padding:6px 10px;font-size:12px;font-weight:500;margin:0 6px 6px 0;}
.termtag i{width:9px;height:9px;border-radius:50%;background:var(--line);display:block;font-style:normal;}

/* ---------- exam navigator ---------- */
.grid{display:grid;grid-template-columns:repeat(10,1fr);gap:4px;}
@media (max-width:520px){ .grid{grid-template-columns:repeat(8,1fr);} }
.grid button{aspect-ratio:1;border:1px solid var(--hair);font-size:11px;font-weight:500;
  font-variant-numeric:tabular-nums;display:grid;place-items:center;}
.grid button.ans{color:#fff;border-color:transparent;}
.grid button.flag{border-color:var(--warn);border-width:2px;color:var(--warn);}
.grid button.now{outline:3px solid var(--line);outline-offset:-3px;}

/* ---------- glossary ---------- */
.gitem{transition:background var(--fast) var(--ease);display:flex;gap:12px;width:100%;text-align:left;padding:13px 16px;border-bottom:1px solid var(--dim);align-items:flex-start;}
.gitem .gt{flex:1 1 auto;min-width:0;}
.gitem strong{font-weight:500;display:block;}
@media (hover:hover){ .gitem:hover{background:var(--panel);} }
.gitem span{font-size:.88em;color:var(--soft);display:block;margin-top:2px;line-height:1.4;}

.star{min-width:40px;height:38px;display:grid;place-items:center;font-size:17px;line-height:1;}
.star.on{color:var(--line);}
.hide{display:none !important;}
.sr{position:absolute;width:1px;height:1px;margin:-1px;padding:0;overflow:hidden;
  clip:rect(0 0 0 0);white-space:nowrap;border:0;}
.cols{display:block;}
.kbd{display:none;}
.colophon{padding:20px 16px calc(30px + env(safe-area-inset-bottom));font-size:11px;line-height:1.7;color:var(--soft);}

/* ================= DESKTOP ================= */
@media (min-width:1000px){
  .shell{display:grid;grid-template-columns:var(--side) minmax(0,1fr);min-height:100vh;}
  .side{
    display:block;position:sticky;top:0;height:100vh;overflow-y:auto;
    background:var(--fg);color:var(--bg);padding:22px 0;
  }
  .side .wordmark{font-size:20px;font-weight:500;letter-spacing:-.02em;padding:0 20px 4px;}
  .side .wordsub{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;
    padding:0 20px 18px;color:rgba(150,150,150,1);}
  .navitem{display:flex;align-items:center;gap:11px;width:100%;text-align:left;
    padding:12px 20px;font-size:14px;color:var(--bg);}
  .navitem:hover{background:rgba(127,127,127,.22);}
  .navitem.on{background:rgba(127,127,127,.32);font-weight:500;}
  .navitem i{width:9px;height:9px;border-radius:50%;background:currentColor;display:block;opacity:.5;}
  .navitem.on i{opacity:1;}
  .navsep{height:1px;background:rgba(127,127,127,.4);margin:14px 20px;}
  .legend{display:flex;gap:4px;padding:2px 20px 12px;}
.legend i{flex:1;height:16px;display:block;opacity:.35;}
.legend i.on{opacity:1;}
.sidefoot{padding:8px 20px 20px;font-size:11px;line-height:1.7;color:rgba(150,150,150,1);}
  .sidebarmeter{height:5px;background:rgba(127,127,127,.4);margin:8px 20px 4px;}
  .sidebarmeter i{display:block;height:100%;background:var(--bg);}
  .band{display:none;}
  .main{border-left:0;}
  .pane{max-width:760px;margin:0;padding:0;border-right:1px solid var(--hair);min-height:100vh;}
  body.split .pane{max-width:1180px;}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;}
  .cols > .colA,.cols > .colB{min-width:0;}
  .cols > .colA{border-right:1px solid var(--hair);}
  .cols > .colA > .block:last-child{border-bottom:0;}
  .kbd{display:block;}
  .foot-band{left:var(--side);}
  .desktopbar{
    display:flex;align-items:center;gap:14px;padding:15px 22px;
    position:sticky;top:0;background:var(--line);color:var(--lineink);z-index:20;
    transition:background var(--med) var(--ease);
  }
  .desktopbar .star{color:inherit;}
  .desktopbar .dt{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-size:13px;font-weight:500;letter-spacing:.08em;text-transform:uppercase;}
  .desktopbar .dc{font-size:13px;font-weight:500;font-variant-numeric:tabular-nums;}
  .block{padding:24px 22px;}
  .plate{padding:18px 22px;}
  .clock{top:0;}
}
.desktopbar{display:none;}
@media (min-width:1000px){ .desktopbar{display:flex;} }

/* landscape phone */
@media (orientation:landscape) and (max-height:560px) and (max-width:999px){
  .cols > .colA,.cols > .colB{min-width:0;}
  .block{padding-top:13px;padding-bottom:13px;}
  .lesson-t{font-size:1.25em;margin-bottom:9px;}
  :root{--bar:calc(48px + env(safe-area-inset-bottom));}
  .opt{min-height:44px;padding:9px 12px;}
  .cols{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);align-items:start;}
  .cols > .colA,.cols > .colB{min-width:0;}
  .cols > .colA{border-right:1px solid var(--hair);}
  .pane,body.split .pane{max-width:none;}
  .card{min-height:150px;padding:16px;}
}

@media (max-width:360px){
  .block{padding:16px 13px;}
  .plate,.chband{padding:14px 13px;gap:10px;}
  .opt{padding:12px 11px;gap:10px;}
  .cardnav button{min-height:66px;}
  .cardnav b{font-size:11.5px;letter-spacing:.04em;}
  .stage{padding:16px 12px 0;}
  .face{padding:15px 16px;}
  .foot-band button{font-size:14px;letter-spacing:.04em;padding:0 10px calc(env(safe-area-inset-bottom));}
  .foot-band button.alt{flex:0 0 38%;}

/* ---------- print: chapter revision notes ---------- */
@media print{
  .side,.band,.foot-band,.desktopbar,.clock,.opts,.stage,.cardnav,.colophon,.noprint{display:none !important;}
  body{font-size:11pt;background:#fff;color:#000;}
  .pane{max-width:none;}
  .block{padding:10pt 0;border-bottom:1px solid #999;break-inside:avoid;}

}
#toast{
  position:fixed;left:50%;transform:translateX(-50%) translateY(20px);
  bottom:calc(var(--bar) + 16px);z-index:60;background:var(--fg);color:var(--bg);
  padding:11px 16px;font-size:13px;display:flex;align-items:center;gap:14px;
  opacity:0;pointer-events:none;transition:opacity var(--med) var(--ease),transform var(--med) var(--ease);
  max-width:calc(100% - 32px);
}
#toast.on{opacity:1;transform:translateX(-50%) translateY(0);pointer-events:auto;}
#toast button{text-decoration:underline;font-size:13px;color:inherit;}
#err{display:none;position:fixed;left:0;right:0;top:0;z-index:99;background:var(--warn);
  color:#fff;padding:10px 14px;font-size:12px;line-height:1.4;word-break:break-word;}

<script>
window.onerror=function(m,s,l){var e=document.getElementById("err");e.style.display="block";
  e.textContent="Error: "+m+" (line "+l+")";return false;};
const LESSONS = [
{ch:1,term:"Investing",t:"What investing actually is",
teach:"You have money. You can spend it now, or you can hand it to someone who will use it to do something useful — and hope you get more back later. That is the whole idea. <b>Investing</b> is giving your money to a business or a government so they can use it, in exchange for a claim on what comes back.<br><br>Nothing about this is guaranteed. That is the catch, and everything else in this exam grows out of that catch.",
eg:"You lend a friend $100 to buy a lawnmower. She cuts lawns and pays you back $110. You invested.",
q:"What makes investing different from just saving cash in a drawer?",
o:["Your money is handed to someone who puts it to use, and may come back as more or less","Investing is always safe, saving is risky","Investing is only for rich people","The government guarantees the money will grow"],
a:0,why:"The money goes to work, and the outcome is uncertain. Money in a drawer does nothing, but nothing is also the worst it can do."},

{ch:1,term:"Risk and return",t:"The one trade behind everything",
teach:"If something is very likely to pay you back, people will accept a small reward for it. If it might not pay you back, you need a bigger reward to be tempted. That is the whole deal: <b>more risk, more expected return</b>.<br><br>Note the word <b>expected</b>. A risky thing does not reliably pay more. It just has to promise more to get anyone interested.",
eg:"The Government of Canada pays maybe 3% to borrow from you. A shaky new company might have to offer 11%. The 11% is the sound of nervousness.",
q:"A bond pays a much higher interest rate than a government bond. What is the most likely reason?",
o:["It is a better investment in every way","There is a real chance the borrower does not pay you back","The government is subsidising it","Higher rates always mean lower risk"],
a:1,why:"Extra return is compensation for extra risk. If it were as safe and paid more, nobody would buy the government one."},

{ch:1,term:"Share",t:"What a company is, and what a share is",
teach:"A company is just an organisation people set up to do business. It is treated as a separate legal <b>person</b> — it can own things and owe money in its own name.<br><br>Ownership of a company is chopped into equal slices called <b>shares</b>. Own one share out of a million and you own one millionth of that company. Buying shares is called buying <b>equity</b>, and equity just means ownership.",
eg:"Loblaw has roughly 300 million shares. Buy 300 of them and you own about one millionth of every store, truck and till.",
q:"What does owning a share of a company actually give you?",
o:["A loan agreement with the company","A guaranteed annual payment","A slice of ownership in the company","The right to use the company's products free"],
a:2,why:"A share is a piece of ownership. That is why the whole category is called equity."},

{ch:1,term:"Dividend",t:"How owning a share pays you",
teach:"There are only two ways a share pays you.<br><br>One: the company makes a profit and hands some of it to owners. That payment is a <b>dividend</b>. It is optional — the company decides each time, and can cut it.<br><br>Two: someone later pays you more for the share than you paid. That gain is a <b>capital gain</b>. If they pay you less, it is a capital loss.",
eg:"You buy a share at $40. It pays you $2 in dividends over the year, then you sell it for $46. You made $2 income and $6 of capital gain.",
q:"Which is true of a dividend?",
o:["It is a fixed payment the company legally owes you","It is decided by the company and can be reduced or stopped","It is the same as a capital gain","It is paid by the stock exchange"],
a:1,why:"Dividends are discretionary. That is the key difference from the interest on a bond, which is a genuine debt."},

{ch:1,term:"Bond",t:"Lending instead of owning",
teach:"Instead of owning a slice of a business, you can simply <b>lend</b> it money. When you lend to a company or a government by buying a tradeable IOU, that IOU is a <b>bond</b>.<br><br>A bond promises two things: regular interest payments, and your original money back on a set date. The interest payment is the <b>coupon</b>. The set date is the <b>maturity</b>. The original amount is the <b>face value</b> or <b>par</b>.",
eg:"A $1,000 bond with a 4% coupon maturing in 2031 pays you $40 a year, then hands back your $1,000 in 2031.",
q:"What does a bond represent?",
o:["Ownership of part of the issuer","A loan you have made to the issuer","A promise of a share of profits","An insurance policy on a company"],
a:1,why:"A bond is debt. You are a lender, not an owner — which is why you get paid before owners do."},

{ch:1,term:"Ranking",t:"Why lenders get paid before owners",
teach:"If a company runs out of money and collapses, there is a queue. <b>Lenders get paid first.</b> Owners get whatever is left, which is often nothing.<br><br>That is the deal. Bondholders take less risk and get a capped, predictable return. Shareholders take more risk, can lose everything, and in exchange get unlimited upside if things go well. Shareholders are called the <b>residual</b> claim because they get the residue — what's left.",
eg:"A failed company sells everything for $10 million and owes lenders $12 million. Lenders take a haircut. Shareholders get zero.",
q:"In a company failure, who is paid first?",
o:["Shareholders, because they own the company","Bondholders and other lenders","Whoever invested most recently","Everyone is paid equally"],
a:1,why:"Debt ranks ahead of equity. This single fact explains why shares are riskier and why they need to offer more upside."},

{ch:1,term:"Interest rate",t:"Interest rates: the price of money",
teach:"An <b>interest rate</b> is simply the rent charged on borrowed money. Canada's central bank, the <b>Bank of Canada</b>, sets a key rate that pulls every other rate along with it.<br><br>When the Bank raises rates, borrowing gets expensive, people spend less, and the economy cools. When it cuts rates, borrowing gets cheap and activity picks up. Managing the economy this way is called <b>monetary policy</b>.",
eg:"Rates go up, your mortgage payment goes up, you eat out less, restaurants hire fewer people, the economy slows. That chain is the point.",
q:"What is the Bank of Canada doing when it raises its policy rate?",
o:["Making borrowing more expensive to cool the economy","Collecting taxes to fund government spending","Guaranteeing bank deposits","Setting the price of shares"],
a:0,why:"Rates are the central bank's main lever, and this is monetary policy. Taxing and spending is the government's lever, called fiscal policy."},

{ch:1,term:"Inflation",t:"Inflation, and why it matters to you",
teach:"<b>Inflation</b> is prices generally rising, which means each dollar buys less than it used to. It is measured by the <b>Consumer Price Index (CPI)</b> — the cost of a fixed basket of ordinary goods, tracked over time.<br><br>Inflation is the quiet enemy of savers. If your money earns 2% and prices rise 3%, you got poorer while your balance went up.",
eg:"Groceries that cost $100 last year cost $103 now. Your $100 in the drawer just lost real value without moving.",
q:"Which report is the main measure of inflation?",
o:["The Employment Report","The Consumer Price Index","The Retail Sales Report","The company's annual report"],
a:1,why:"CPI tracks the price of a standard basket of goods. Remember this pairing — it comes up directly on the exam."},

{ch:1,term:"Asset class",t:"The five buckets",
teach:"Everything an investor can buy is sorted into <b>asset classes</b> — families of investment that behave alike.<br><br><b>Cash and equivalents</b> — money and near-money you can access fast. <b>Fixed income</b> — bonds and other lending. <b>Equity</b> — shares. <b>Commodities</b> — physical stuff like oil, wheat, gold. <b>Derivatives</b> — contracts whose value comes from something else, which you will meet later.",
eg:"A portfolio might be 5% cash, 40% bonds, 50% shares, 5% gold. Those percentages are the real decision.",
q:"Bonds belong to which asset class?",
o:["Equity","Fixed income","Commodities","Cash and equivalents"],
a:1,why:"Bonds pay a fixed, scheduled income, hence fixed income. Equity means ownership; commodities are physical goods."},

{ch:1,term:"Diversification",t:"Why nobody sensible buys just one thing",
teach:"Any single company can fail for reasons nobody saw coming. Spreading money across many different investments is <b>diversification</b>, and it means no single disaster can wipe you out.<br><br>The opposite is <b>concentration</b> — too much riding on one company, one industry, or one country. Diversification cannot remove risk from the whole market falling at once, but it removes the risk of being destroyed by one bad name.",
eg:"Owning 200 companies means one going bankrupt costs you half a percent. Owning one means it costs you everything.",
q:"What does diversification protect against?",
o:["Any possibility of losing money","The risk that one investment fails badly","Inflation","Interest rate changes"],
a:1,why:"It spreads company-specific risk. Market-wide falls, inflation and rate moves still hit a diversified portfolio."},

{ch:2,term:"Market",t:"What a market really is",
teach:"A <b>market</b> is just a place where buyers and sellers meet to agree prices. A <b>stock exchange</b> such as the Toronto Stock Exchange is an organised market with rules about who can list and how trading works.<br><br>The price of a share is nothing mystical. It is simply the price at which the last buyer and seller agreed. It moves because opinions about the company's future keep changing.",
eg:"A share is worth $52 because someone just paid $52. A minute later it is $51.90 for the same reason.",
q:"What sets the price of a listed share?",
o:["The company's board of directors","The stock exchange","What a buyer and seller agree to trade at","The Canadian Securities Administrators"],
a:2,why:"Prices come out of agreement between buyers and sellers. No regulator or company sets them."},

{ch:2,term:"Primary and secondary",t:"New shares versus second-hand shares",
teach:"When a company sells shares to raise money for itself, that is the <b>primary market</b>. The company gets the cash. To do this publicly it must publish a <b>prospectus</b> — a long, formal document disclosing the business, the risks and the terms.<br><br>After that, investors trade those same shares among themselves on the <b>secondary market</b>. The company gets nothing from those trades. Almost all daily trading is secondary.",
eg:"A bakery sells shares and raises $10 million to build a factory: primary. You buy those shares from another investor next year: secondary.",
q:"When you buy shares of an established company on an exchange, who receives your money?",
o:["The company, to fund its operations","The investor selling you the shares","The regulator","The stock exchange"],
a:1,why:"That is a secondary market trade — money moves between investors. Only the primary market puts money into the company."},

{ch:2,term:"Prospectus",t:"The prospectus, and getting out of one",
teach:"A <b>prospectus</b> is the disclosure document a company must file and deliver when selling securities to the public. A regulator reviews it — but reviewing it only means the disclosure looks adequate. <b>Nobody is saying the investment is any good.</b><br><br>Some sales are exempt from needing one. The rule listing those exemptions is <b>National Instrument 45-106</b>, and the best-known exemption covers <b>accredited investors</b> — people or firms wealthy enough to be presumed able to fend for themselves.",
eg:"Selling shares to the public: prospectus. Selling them privately to a pension fund: exempt.",
q:"What does National Instrument 45-106 deal with?",
o:["What must be written inside a prospectus","When you do not need to file a prospectus","The government's guarantee of a prospectus","How shares are priced on an exchange"],
a:1,why:"45-106 is the exemptions rule — think of it as the side door. And regulators never guarantee anything in a prospectus."},

{ch:2,term:"Dealer",t:"The middleman: what a dealer does",
teach:"Ordinary people cannot walk onto an exchange and trade. You need a firm that is a member of the market to do it for you. That firm is an <b>Investment Dealer</b> — often called a broker or brokerage.<br><br>Its core job is to take your order, get it executed, and settle the trade. It also holds your securities and money, sends statements, and may give advice.",
eg:"You tap 'buy' in an app. The app's firm is a dealer. It routes your order to a market and confirms the fill back to you.",
q:"What is the core role of an Investment Dealer?",
o:["To set share prices","To guarantee investor profits","To take client orders and arrange for them to be executed and settled","To write the securities laws"],
a:2,why:"A dealer is an intermediary — it connects clients to markets and handles the money and securities afterwards."},

{ch:2,term:"Agent and principal",t:"Two hats a dealer can wear",
teach:"When the dealer takes your order to the market and arranges a trade for you, it acts as your <b>agent</b> and is normally paid a <b>commission</b>.<br><br>Sometimes the dealer sells you the security from its own holdings instead. Now it is the other side of your trade — this is trading as <b>principal</b>, and the firm makes money on the difference between what it paid and what you pay. Because its interests and yours now pull in opposite directions, extra disclosure rules kick in.",
eg:"Agent: the dealer is the taxi. Principal: the dealer is the person selling you the car.",
q:"A dealer fills your buy order from its own inventory. It is acting as:",
o:["Agent","Principal","Trustee","Regulator"],
a:1,why:"Selling from its own book makes the dealer your counterparty, which is principal trading. Arranging a trade for you is agency."},

{ch:2,term:"Bid and ask",t:"Bid, ask, and the spread",
teach:"At any moment a security has two prices. The <b>bid</b> is the highest price anyone is currently willing to pay. The <b>ask</b> (or offer) is the lowest price anyone is willing to sell at. The gap between them is the <b>spread</b>.<br><br>Buy right now and you pay the ask. Sell right now and you get the bid. The spread is a real cost of trading, even when no commission is charged.",
eg:"Bid $51.98, ask $52.02. Buy and sell instantly and you are down four cents a share before any fee.",
q:"If you want to sell shares immediately, what price do you get?",
o:["The ask price","The bid price","The midpoint","Yesterday's closing price"],
a:1,why:"Sellers meet the bid; buyers pay the ask. The spread between them is a hidden cost."},

{ch:2,term:"Order types",t:"Market orders and limit orders",
teach:"A <b>market order</b> says: fill me now, whatever the price. You get certainty that it happens, but not certainty about the price.<br><br>A <b>limit order</b> says: fill me only at this price or better. A buy limit sets a maximum you will pay; a sell limit sets a minimum you will accept. You get certainty about price, but it might never fill at all.",
eg:"Stock trades at $52. Your limit order to buy at $50 just sits there. If the stock never drops to $50, you never own it.",
q:"You place a limit order to buy at $50 while the stock trades at $52. What happens?",
o:["It fills right away at $52","It may never fill unless the price comes down to $50","It automatically becomes a market order","It fills at $50 immediately"],
a:1,why:"A buy limit will not pay more than your limit. Nothing converts it into a market order on its own."},

{ch:2,term:"Settlement",t:"Settlement: who actually moves the stuff",
teach:"Agreeing a trade and completing it are two different events. <b>Settlement</b> is the completion — securities move to the buyer, money moves to the seller.<br><br>In Canada this is handled centrally by <b>CDS</b>, the Canadian Depository for Securities. For exchange-traded derivatives, the equivalent is the <b>CDCC</b>. These are plumbing organisations. They do not regulate anyone or protect you from bad investments.",
eg:"You buy at 10am. CDS makes sure that a day or so later your shares are really yours and the seller really has the cash.",
q:"What does CDS do?",
o:["Regulates Investment Dealers","Clears and settles securities trades","Compensates investors for losses","Approves prospectuses"],
a:1,why:"CDS is settlement infrastructure. Regulation is CIRO and the CSA; compensation on insolvency is CIPF."},

{ch:2,term:"OTC",t:"Not everything trades on an exchange",
teach:"Shares mostly trade on exchanges. <b>Bonds mostly do not.</b> They trade <b>over the counter (OTC)</b> — negotiated directly between dealers, or between a dealer and a client, by phone or electronic message.<br><br>OTC markets are more flexible but less transparent. There is no single visible order book, so it is harder to check you got a fair price — which is exactly why the rules about fair pricing matter more there.",
eg:"Want a specific corporate bond? Your dealer calls around or checks its own inventory. There is no big screen showing one true price.",
q:"How are most bonds traded in Canada?",
o:["Only on the Toronto Stock Exchange","Over the counter","Only by the Bank of Canada","Through a public auction each morning"],
a:1,why:"Fixed income is predominantly an OTC market, which is why pricing transparency is a recurring theme in the rules."},

{ch:2,term:"Marketplaces",t:"The four kinds of trading venue",
teach:"Four venue types show up in the exam. An <b>exchange</b> lists securities, sets listing standards, and matches trades. An <b>alternative trading system (ATS)</b> matches trades but lists nothing. A <b>crypto-asset trading platform (CTP)</b> trades crypto assets. A <b>foreign organized regulated market (FORM)</b> is an overseas venue recognised as properly regulated.<br><br>The dividing line to remember: <b>listing</b>. Only an exchange lists.",
eg:"TSX lists companies and trades them. An ATS just trades what is already listed elsewhere.",
q:"A venue matches trades in already-listed shares but lists nothing itself. What is it?",
o:["An exchange","An alternative trading system","A clearing agency","A crypto-asset trading platform"],
a:1,why:"No listing function means it is an ATS. A clearing agency does not match trades at all — it settles them afterwards."},
{ch:3,term:"Investment Dealer",t:"The firm you would work for",
teach:"An <b>Investment Dealer</b> is a firm registered to trade securities for clients. Some are huge bank-owned outfits; some are small independents. What makes it a dealer is registration and membership, not size.<br><br>Because it holds other people's money and securities, a dealer must keep enough <b>capital</b> of its own to meet its obligations. Running short is a serious regulatory failure, not just a business problem.",
eg:"Think of a dealer as a bank branch for investments: it holds your assets, executes your instructions, and must stay solvent doing it.",
q:"What is a dealer's primary responsibility around funding under CIRO rules?",
o:["Invest surplus funds in high-return securities","Maintain enough capital to meet its obligations","Use client deposits as working capital","Report shortfalls once a year"],
a:1,why:"Adequate capital is the core prudential duty. Using client money as working capital is precisely what the rules exist to prevent."},

{ch:3,term:"RR and IR",t:"Two jobs: RR and IR",
teach:"Inside a dealer there are two client-facing approval categories, and the difference is the single most testable thing in this section.<br><br>A <b>Registered Representative (RR)</b> may <b>give advice and make recommendations</b>, and may manage a client's portfolio.<br><br>An <b>Investment Representative (IR)</b> may take and enter orders, answer questions and give quotes — but is <b>forbidden from making investment recommendations</b>. Full stop.",
eg:"Client asks 'should I buy this?' An RR can answer. An IR must not, however casually it is asked.",
q:"A client asks their Investment Representative whether to buy a bank stock. The IR should:",
o:["Give an opinion, since it is informal","Decline to recommend and refer the client appropriately","Recommend it if it looks suitable","Recommend it and record the advice"],
a:1,why:"The ban on recommendations is absolute for an IR. Take the order, or route the client to an RR."},

{ch:3,term:"Retail and institutional",t:"Two kinds of client",
teach:"A <b>retail client</b> is an ordinary investor. A <b>institutional client</b> is a professional operation — a bank, a pension fund, a regulated entity, or a big enough non-individual.<br><br>The line matters because retail clients get far more protection. Institutional clients are presumed able to look after themselves, so some retail-style requirements are relaxed for them. What never relaxes: honesty, identity checks and anti-money-laundering duties.",
eg:"A teacher with $60,000: retail. A pension plan with $4 billion: institutional.",
q:"Why does the retail versus institutional distinction exist?",
o:["Institutional clients pay higher fees","Retail clients need more protection, so more requirements apply to them","Institutional clients are exempt from all rules","Retail clients cannot buy bonds"],
a:1,why:"Protection scales with vulnerability. Institutions get some relief, but never a free pass on conduct or AML."},

{ch:3,term:"$10 million test",t:"When a client counts as institutional",
teach:"CIRO defines institutional clients by category, not by vibe. The list: accepted counterparties, accepted institutions, <b>regulated entities</b>, registrants other than individuals, a <b>non-individual with more than $10 million</b> in securities and precious metals bullion under administration, an <b>individual over $10 million who requests and consents</b>, or a hedger who requests and consents.<br><br>Note the asymmetry: a big company qualifies automatically; a rich individual must ask to be treated that way.",
eg:"A corporation with $14 million: automatically institutional. A person with $14 million: only if they ask and agree.",
q:"A corporation with $14 million under administration opens an account. It is:",
o:["Retail, unless it signs a waiver","Institutional, on the non-individual $10 million threshold","Retail, because only banks can be institutional","Institutional only if it requests and consents"],
a:1,why:"For a non-individual, crossing $10 million is enough by itself. Request-and-consent is the extra step for individuals and hedgers."},

{ch:3,term:"Service levels",t:"Four ways to serve a client",
teach:"Sort these by <b>who makes the decision</b>.<br><br><b>Order execution only (OEO)</b> — the client decides everything, no advice is given at all.<br><b>Advisory</b> — the representative recommends, the <b>client approves each trade</b>.<br><b>Managed / discretionary</b> — the firm decides and trades <b>without asking first</b> each time.<br><br>More discretion means a heavier duty, which is where the next lesson comes in.",
eg:"OEO is a hardware shop. Advisory is a builder who quotes and waits for your yes. Managed is a builder with your house keys.",
q:"An RR recommends a strategy and waits for the client to confirm. This is:",
o:["An order execution only account","An advisory account","A managed account","A discretionary account"],
a:1,why:"Recommendation plus client sign-off on each trade is the signature of an advisory relationship."},

{ch:3,term:"Fiduciary duty",t:"Trust, agency and fiduciary duty",
teach:"Three words that sound similar and are not.<br><br><b>Trust</b> — the client's confidence in the firm. A feeling, not a legal test.<br><b>Agency</b> — acting on the client's behalf, as when arranging a trade.<br><b>Fiduciary duty</b> — the strongest standard in the book: the client's interest above your own and your firm's, with no balancing. It applies most clearly to <b>managed and discretionary accounts</b>, where you hold the keys.",
eg:"A fiduciary who finds a cheaper product that suits the client better must use it, even if the expensive one pays the firm more.",
q:"Which statement about fiduciary duty is correct?",
o:["It requires balancing the client's interests against firm profitability","It obliges the manager to put the client's interest above all else","It applies only to order execution only accounts","It is the same thing as trust"],
a:1,why:"No balancing act. Fiduciary means the client comes first, and it bites hardest where the firm has discretion."},

{ch:3,term:"Fees",t:"How the money is made, and what it costs you",
teach:"Dealers earn through <b>commissions</b> per trade, ongoing <b>fees</b> on assets, <b>spreads</b> on principal trades, and fees embedded inside products.<br><br>Three things quietly eat client returns: <b>fees</b>, <b>turnover</b> (each trade costs money, so frequent trading multiplies cost) and <b>taxes</b>. Fees are not a small nibble — they reduce the base that compounds, so their damage grows the longer you hold.",
eg:"2% a year sounds trivial. Over 25 years it can swallow roughly a third of what you would otherwise have.",
q:"Which best describes the impact of fees?",
o:["Fees can improve returns if managed well","Fees reduce the client's overall investment returns","Fees only matter in the short term","Fees have no meaningful long-term effect"],
a:1,why:"Fees are a direct subtraction, and the long run is where they hurt most through lost compounding."},

{ch:4,term:"Why regulate",t:"Why any of this is regulated",
teach:"Investing runs on information you cannot verify and money you hand to strangers. Without rules, the tempting move is to lie, to churn accounts for commission, or to help yourself to client assets.<br><br>So the entire regulatory system exists for one purpose: <b>keeping investors confident that the market is fair.</b> If confidence dies, people stop investing, and companies cannot raise money. Every rule you will learn traces back to that sentence.",
eg:"Nobody hands savings to a stranger in an industry known for stealing. Confidence is the product.",
q:"What is the underlying purpose of ethical standards in the investment industry?",
o:["To create paperwork for compliance departments","To maintain investor confidence in market integrity","To limit how much dealers can earn","To replace the rules with general principles"],
a:1,why:"Confidence in market integrity is the stated goal. Standards sit alongside the rules; they do not replace them."},

{ch:4,term:"CSA",t:"Canada has no national regulator",
teach:"Unlike most countries, Canada has <b>no single national securities regulator</b>. Each province and territory has its own commission, and its own securities law.<br><br>To stop this becoming chaos, the commissions coordinate through the <b>Canadian Securities Administrators (CSA)</b>. The CSA is an umbrella body. It has no statute of its own and cannot register or discipline anyone — the member commissions do that.",
eg:"Ontario has the OSC, Quebec has the AMF, BC has the BCSC. The CSA is the table they all sit at.",
q:"What does the CSA do?",
o:["Replaces provincial commissions with one federal licence","Coordinates and harmonises rules across the provincial regulators","Enforces UMIR on Canadian marketplaces","Protects clients if a dealer goes bankrupt"],
a:1,why:"The CSA harmonises. Enforcement and registration stay provincial; UMIR is CIRO's; insolvency cover is CIPF's."},

{ch:4,term:"National Instrument",t:"The tiers of CSA rules",
teach:"CSA output comes in layers, and the exam tests the difference.<br><br>A <b>National Instrument (NI)</b> becomes law once each jurisdiction adopts it. A <b>Multilateral Instrument (MI)</b> is the same, but only some jurisdictions signed up. A <b>Companion Policy (CP)</b> explains how regulators interpret an instrument — influential, but not law itself. <b>Staff notices</b> flag concerns and expectations.",
eg:"The instrument is the statute. The Companion Policy is the regulator saying 'and here is what we mean by that'.",
q:"How should a Companion Policy be described?",
o:["Binding law identical in force to the instrument","Regulatory guidance on how the instrument is interpreted","A rule adopted by only some provinces","An enforcement order against a firm"],
a:1,why:"CPs interpret. Partial adoption across provinces describes a Multilateral Instrument instead."},

{ch:4,term:"CIRO",t:"CIRO: the industry's own police force",
teach:"<b>CIRO</b> — the Canadian Investment Regulatory Organization — is a <b>self-regulatory organization</b>. The provinces delegate day-to-day supervision of the industry to it. CIRO oversees all Investment Dealers, all Mutual Fund Dealers, and all trading on Canada's debt and equity marketplaces.<br><br>It writes rules, inspects firms, approves individuals, investigates misconduct, and holds disciplinary hearings. It is the body whose exam you are sitting.",
eg:"The provinces make the law. CIRO walks the beat every day.",
q:"What is CIRO?",
o:["A federal government department","A self-regulatory organization overseeing dealers and marketplace trading","An investor compensation fund","A stock exchange"],
a:1,why:"CIRO is the national SRO for dealers and market conduct. Compensation is CIPF; exchanges are marketplaces CIRO oversees."},

{ch:4,term:"IDPC and UMIR",t:"CIRO's two rule books",
teach:"CIRO has two main rule books, and knowing which is which will win you marks.<br><br>The <b>IDPC Rules</b> (Investment Dealer and Partially Consolidated Rules) govern <b>how a firm runs its business and treats clients</b>: KYC, suitability, complaints, capital, supervision.<br><br><b>UMIR</b> (Universal Market Integrity Rules) governs <b>how orders and trades behave in the market</b>: best execution, manipulation, front running, gatekeeping.",
eg:"IDPC is about the client in front of you. UMIR is about the market around you.",
q:"Which rule book covers best execution of client orders?",
o:["The IDPC Rules","UMIR","National Instrument 45-106","The Bank Act"],
a:1,why:"Best execution is a market conduct concept and lives in UMIR. Client account rules live in IDPC."},

{ch:4,term:"Registration",t:"Getting registered, and getting approved",
teach:"To deal in securities you must be <b>registered</b> under provincial securities law. That statutory power sits with the provincial commission, even though CIRO now performs much of the work.<br><br>On top of registration, CIRO <b>approves</b> individuals in specific categories — Registered Representative, Investment Representative, supervisor, and so on — each with its own proficiency requirements. This exam is one of those requirements.",
eg:"Registration is the licence to be in the industry. Approval is permission to do a particular job within it.",
q:"Who holds the statutory power to grant registration to an individual?",
o:["CIRO alone","The provincial or territorial securities commission","OSFI","FINTRAC"],
a:1,why:"Registration is created by provincial securities law, so the commission holds the power even where CIRO does the work."},

{ch:4,term:"CIPF",t:"CIPF: what happens if your dealer collapses",
teach:"If your dealer becomes <b>insolvent</b> and client property is missing, the <b>Canadian Investor Protection Fund (CIPF)</b> steps in and restores property within set limits. It also helps pool customer assets in the bankruptcy.<br><br>Read what it does not do. CIPF <b>does not</b> cover investment losses, bad advice, or a share that simply went down. It is insolvency insurance, not performance insurance.",
eg:"Dealer goes bust and your shares have vanished: CIPF. Your shares halved because the company did badly: not CIPF, and not anyone.",
q:"A client's portfolio fell 40% on poor advice and the dealer is solvent. What can CIPF do?",
o:["Reimburse the loss caused by the advice","Nothing — CIPF covers missing property on insolvency only","Order the dealer to compensate","Refer the matter for restitution"],
a:1,why:"CIPF is triggered by insolvency, not by loss. A suitability complaint goes to the firm, then OBSI, arbitration or court."},

{ch:4,term:"The other agencies",t:"The rest of the cast",
teach:"Learn these by their beat, one line each.<br><br><b>OSFI</b> — supervises the safety of federally regulated banks, insurers and pension plans.<br><b>FINTRAC</b> — receives and analyses money-laundering reports.<br><b>FSRA</b> — Ontario's regulator for insurance, pensions and credit unions.<br><b>OBSI</b> — free, independent dispute resolution for clients.<br><b>IMET</b> — RCMP teams investigating serious capital markets crime.<br><b>Bank of Canada</b> — the central bank, running monetary policy.",
eg:"If a question names an agency, ask 'what is its beat?' The answer is almost always one of these six lines.",
q:"Which is correct?",
o:["FSRA supervises Investment Dealers' trading conduct","OSFI receives suspicious transaction reports","FINTRAC analyses money laundering and terrorist financing reports","IMET runs the investor compensation fund"],
a:2,why:"FINTRAC is Canada's financial intelligence unit. Dealer conduct is CIRO's beat; OSFI is prudential; IMET investigates and pays nothing."},

{ch:4,term:"Other statutes",t:"Four laws worth a line each",
teach:"<b>Bank Act</b> — governs the operation and stability of Canadian banks.<br><b>Bankruptcy and Insolvency Act, Part XII</b> — the bankruptcy of a securities firm.<br><b>PIPEDA</b> — how client personal information must be collected, used and protected.<br><b>Canadian Anti-Spam Legislation (CASL)</b> — commercial electronic messages.<br><br>The exam tests purpose and implication only. You do not need section numbers.",
eg:"Question mentions client data being kept safe? That is PIPEDA, every time.",
q:"Which law is the principal one requiring client personal data to be held safely?",
o:["The IDPC Rules","UMIR","The Criminal Code","PIPEDA"],
a:3,why:"PIPEDA is the privacy statute. The rule books cover conduct; the Criminal Code covers crime."},
{ch:5,term:"KYC",t:"Know your client, and why",
teach:"Before you can tell anyone what to do with their money, you have to know who they are and what they need. That duty is <b>know your client (KYC)</b>.<br><br>It does two jobs at once. It lets you judge whether something suits the person, and it lets you spot money laundering, because you cannot notice odd behaviour without knowing what normal looks like for that client.",
eg:"A $2,000-a-month client suddenly wiring $400,000 abroad is only remarkable if you knew about the $2,000.",
q:"KYC information serves which two purposes?",
o:["Marketing and tax filing","Suitability judgements and spotting suspicious activity","Setting fees and calculating commission","Credit scoring and insurance pricing"],
a:1,why:"KYC underpins both suitability and anti-money-laundering monitoring. That dual role is why it is collected before anything else."},

{ch:5,term:"KYC contents",t:"What you actually collect",
teach:"For a retail client you collect six things: <b>personal circumstances</b>, <b>financial circumstances</b>, <b>investment knowledge</b>, <b>risk profile</b>, <b>investment objectives and needs</b>, and <b>time horizon</b>.<br><br>The commonly missed ones are personal circumstances and knowledge. Age, dependants, job security and how much the client actually understands all shape what is suitable — not just the size of their bank balance.",
eg:"Two clients each have $200,000. One is 30 with a steady salary. One is 68 and retired. Same money, entirely different suitable answer.",
q:"Which set best reflects required retail KYC?",
o:["Financial circumstances, knowledge, objectives and risk profile","Personal and financial circumstances, knowledge, needs, objectives and risk profile","Existing portfolio, income and outgoings, attitude to risk","Financial circumstances, given the services supplied"],
a:1,why:"The full set includes personal circumstances and needs. Options that drop them are the classic wrong answers."},

{ch:5,term:"Tolerance vs capacity",t:"Willing versus able",
teach:"The <b>risk profile</b> has two halves that people constantly confuse.<br><br><b>Risk tolerance</b> is <b>willingness</b> — how much of a drop the client can emotionally handle.<br><b>Risk capacity</b> is <b>ability</b> — how much loss they could take without wrecking their actual plans.<br><br>The profile is set by whichever is <b>lower</b>. A brave client with a house deposit due next year still has low capacity, and capacity wins.",
eg:"'I'm fine with volatility' plus 'I need this money in 14 months' equals a conservative portfolio, whatever the client says.",
q:"A client is comfortable with big swings but needs the money in 18 months. What governs?",
o:["Risk tolerance, since the client stated their comfort","Risk capacity, since ability to absorb loss is the binding limit","Neither, the client may waive the profile","Whichever the client picks on the form"],
a:1,why:"Willingness cannot create ability. The more restrictive of the two sets the profile, and retail clients cannot waive suitability."},

{ch:5,term:"Relationship disclosure",t:"Telling the client how this works",
teach:"<b>Relationship disclosure</b> is the document that explains the relationship in <b>plain language</b>: what products, services and account types are available, what the limits are, all charges and fee structures, how the account will operate, how suitability will be determined, and what reporting the client will get.<br><br>It must be titled 'relationship disclosure' so the client can actually find it. There is no page limit and no requirement to post and sign it.",
eg:"If a client is later surprised by a fee or a limitation, the relationship disclosure was the place it should have appeared.",
q:"Which is true about the relationship disclosure?",
o:["It is limited to four sides of paper","It must be in plain language and titled 'relationship disclosure'","It must be posted, signed and returned","It is based on informal conversations"],
a:1,why:"Plain language and a findable title. If a firm uses performance benchmarks, this document must also explain how they are used."},

{ch:5,term:"Account types",t:"Cash, margin and registered accounts",
teach:"A <b>cash account</b> means you pay in full for what you buy.<br><br>A <b>margin account</b> lets you <b>borrow from the dealer</b>, using your portfolio as collateral. Borrowing to invest is <b>leverage</b>: it multiplies gains and losses alike, and if the portfolio falls too far you get a <b>margin call</b> demanding more money.<br><br><b>Registered accounts</b> such as RRSPs and TFSAs carry tax advantages and cannot be used to borrow this way.",
eg:"Put in $10,000, borrow $10,000, buy $20,000 of shares. A 20% fall costs you $4,000 — 40% of your own money.",
q:"A client wants to borrow to invest, using their portfolio as collateral. Which account?",
o:["RRSP","TFSA","Cash account","Margin account"],
a:3,why:"Only a margin account permits borrowing against the portfolio. Registered plans cannot, and a cash account requires payment in full."},

{ch:5,term:"Appropriateness",t:"Is this even the right kind of account?",
teach:"Before asking whether an investment suits someone, ask whether the <b>account and service</b> suit them at all. That is <b>account appropriateness</b>, and it is checked at opening and on material change.<br><br>You meet it by explaining what each account type does and costs, so the client lands in the right one. It is a different test from <b>suitability</b>, which operates trade by trade and portfolio-wide.",
eg:"Putting a nervous first-time investor into a leveraged margin account fails appropriateness before any single trade is even considered.",
q:"How does a dealer comply with account appropriateness?",
o:["By assessing each individual trade","By balancing client and dealer interests","By asking clients to unwind unwise orders","By explaining the features and costs of the different account types"],
a:3,why:"Appropriateness matches the client to the right container. Trade-level judgement is the separate suitability obligation."},

{ch:5,term:"KYP",t:"Know your product",
teach:"You cannot responsibly sell what you do not understand. Two layers apply.<br><br><b>Product due diligence</b> is the <b>firm's</b> gate: it assesses a security's <b>risks, structure and costs</b> before putting it on the shelf.<br><br><b>Know your product (KYP)</b> is the <b>individual's</b> duty to understand every investment they buy, sell or recommend — its structure, features, risks, and initial and ongoing costs plus their impact.",
eg:"If you cannot explain in one sentence how a product makes money and how it loses money, you have not met KYP.",
q:"What must a dealer do before making a security available under product due diligence?",
o:["Confirm it is listed on a major exchange","Assess its risks, structure and costs","Verify an analyst recommended it","Confirm it is good value for money"],
a:1,why:"Risk, structure and cost. Whether it is good value for a specific client is the later KYP and suitability question."},

{ch:5,term:"Suitability",t:"Suitability, and the client-first rule",
teach:"<b>Suitability</b> means the action fits the client's KYC — and the modern rule adds a hard edge: you must put the <b>client's interest ahead of your own and your firm's</b>. That is the <b>client-first standard</b>.<br><br>You assess the account, relevant household context and the portfolio as a whole, not just the single trade. Suitability must be reconsidered when the client's circumstances change significantly.",
eg:"Two suitable funds, one paying the firm more. Client-first means the cheaper one wins unless there is a real reason otherwise.",
q:"Which is a fundamental requirement of retail suitability?",
o:["Any action puts the client's interest first","The client understands how markets work","The client can afford the charges","The client understands derivatives"],
a:0,why:"Client-first is the anchor. Understanding and affordability are inputs, but the governing principle is whose interest ranks first."},

{ch:5,term:"Exemptions",t:"When suitability does not apply",
teach:"Suitability determination has carve-outs by <b>account type</b>, <b>service type</b> and <b>client type</b>.<br><br>The clearest are <b>order execution only</b> accounts and <b>direct electronic access</b> — no advice is given, so no suitability determination is required — and <b>permitted clients</b> who waive it in writing.<br><br>What never goes away: identity verification, AML duties and record-keeping.",
eg:"A DIY investor buying through an app gets no suitability review. They still get identity checks and monitoring.",
q:"For which account is a dealer exempt from collecting needs and objectives?",
o:["A derivatives account","A margin account","An RRSP","A direct electronic access account"],
a:3,why:"DEA and OEO are execution-only channels with no advice. Margin accounts and RRSPs are ordinary advised accounts, and derivatives need more diligence, not less."},

{ch:5,term:"TCP and POA",t:"Other people around the account",
teach:"A <b>power of attorney (POA)</b> gives someone genuine legal authority to act on the account. It must be documented, and its scope checked before you act on an instruction.<br><br>A <b>trusted contact person (TCP)</b> is entirely different. The <b>client names</b> them and consents in writing, so the firm can reach out if it suspects financial exploitation or diminished capacity, or cannot reach the client. A TCP has <b>no authority</b> to trade or to see the account.",
eg:"POA can move the money. TCP can only be phoned when something looks wrong.",
q:"Which describes a trusted contact person?",
o:["Someone the dealer appoints for the client to call","Someone the client identifies, whom the dealer may contact with written consent","A lawyer retained by the firm","Someone who can approve trades if the client is unreachable"],
a:1,why:"The client chooses and consents in writing, and the TCP gets no authority. Authority to act is a power of attorney."},

{ch:5,term:"Records",t:"Writing it all down",
teach:"If it is not documented, it did not happen. Dealers must document, file and maintain client records — KYC, instructions, disclosures, complaints.<br><br>Two retention numbers appear on the exam and they differ. FINTRAC's baseline is <b>five years</b> from the end of the relationship. <b>CIRO requires seven years</b> from the date the record was created, with the two most recent years readily accessible. Where they overlap, follow the stricter rule.",
eg:"Asked how long to keep client relationship records under CIRO? Seven years. That is the keyed answer.",
q:"How long must client relationship records be kept under CIRO's requirement?",
o:["Five years from the end of the relationship","Seven years from the date the record is created","Three years after the account closes","Indefinitely unless the client objects"],
a:1,why:"Seven years from creation is CIRO's rule and the one the practice exam keys to. Five years from the end of the relationship is the FINTRAC baseline."},

{ch:6,term:"Money laundering",t:"What money laundering actually is",
teach:"Criminals end up with cash they cannot explain. <b>Money laundering</b> is the process of pushing that money through legitimate systems until it looks clean.<br><br>It runs in three stages. <b>Placement</b> — the dirty money enters the financial system. <b>Layering</b> — a blizzard of transactions hides where it came from. <b>Integration</b> — it re-emerges looking like normal, explainable wealth.",
eg:"Cash into an account (placement), moved through five countries and three funds (layering), used to buy a condo (integration).",
q:"What are the three stages of money laundering, in order?",
o:["Layering, placement, integration","Placement, layering, integration","Integration, layering, placement","Placement, integration, layering"],
a:1,why:"In, obscure, out. Remembering the order is usually enough for the exam."},

{ch:6,term:"PCMLTFA",t:"The law, and who you report to",
teach:"The <b>Proceeds of Crime (Money Laundering) and Terrorist Financing Act (PCMLTFA)</b> is the statute. Reports go to <b>FINTRAC</b>, Canada's financial intelligence unit.<br><br>Firms must run a compliance programme: written policies, a compliance officer, employee training, an <b>enterprise risk assessment</b>, client identification and due diligence, and record-keeping. A <b>suspicious transaction report (STR)</b> is filed when there are reasonable grounds to suspect a transaction relates to laundering or terrorist financing.",
eg:"You do not need proof. Reasonable grounds to suspect is the trigger — and you do not tip off the client.",
q:"Where do suspicious transaction reports go?",
o:["The CSA","CIRO","FINTRAC","OSFI"],
a:2,why:"FINTRAC collects and analyses these reports. CIRO and the CSA regulate conduct; OSFI supervises institutions prudentially."},

{ch:6,term:"PEP",t:"Politically exposed persons",
teach:"A <b>politically exposed person (PEP)</b> holds, or is closely connected to, a prominent public role — a head of state, a judge, a senior official, or their close family and associates.<br><br>Being a PEP is <b>not</b> a crime and not a reason to refuse the client. It raises the risk rating, which triggers <b>enhanced ongoing due diligence</b>: senior management review, source-of-funds enquiry and closer monitoring.",
eg:"A cabinet minister's spouse opens an account. Perfectly allowed — with extra checks and closer watching.",
q:"An existing client becomes a politically exposed person. What is required?",
o:["Apply simplified due diligence","Take enhanced ongoing due diligence and monitor for suspicious activity","Terminate the relationship and file an STR","Freeze the account and notify the CSA"],
a:1,why:"Escalate diligence and monitoring. An STR is only filed where there are actual grounds to suspect wrongdoing."},

{ch:6,term:"Privacy",t:"Client information is not yours",
teach:"Client data is borrowed, not owned. <b>PIPEDA</b> governs how it is collected, used, disclosed and safeguarded. Firms must have policies for maintaining <b>client confidentiality</b>, and <b>cybersecurity</b> is now treated as part of keeping confidential information contained.<br><br>Confidentiality agreements also cover corporate and third-party information a firm learns in the course of business.",
eg:"Gossiping about a client's holdings to a colleague who has no need to know is a breach, even with nothing bad intended.",
q:"Which principal law covers keeping client data safe in Canada?",
o:["UMIR","The IDPC Rules","The Criminal Code","PIPEDA"],
a:3,why:"PIPEDA is the privacy statute. Cybersecurity duties support the same goal of containing confidential information."},
{ch:7,term:"Preferred shares",t:"Common versus preferred shares",
teach:"<b>Common shares</b> are ordinary ownership: normally a vote, discretionary dividends, last in the queue if things fail, and unlimited upside. Loss is capped at what you invested.<br><br><b>Preferred shares</b> sit between bonds and common shares. They pay a <b>fixed dividend that ranks ahead of common</b>, rank ahead of common in a wind-up, and usually carry <b>no vote</b>. The price of that priority is giving up most of the growth.",
eg:"Common: more risk, more upside, a vote. Preferred: steadier income, better queue position, little growth.",
q:"Compared with common shares, preferred shares generally offer:",
o:["More voting power and higher growth","Priority for dividends and in liquidation, with limited capital appreciation","A guaranteed return of capital at maturity","Higher risk and no income"],
a:1,why:"Preference means priority for income and on wind-up, paid for with upside and usually the vote. They are still equity, so the dividend is not legally enforceable like a coupon."},

{ch:7,term:"Dividend tax credit",t:"Why dividends are taxed gently",
teach:"The company already paid tax on its profits before paying you a dividend. To avoid taxing the same money twice, Canada uses a <b>gross-up and dividend tax credit</b> mechanism.<br><br>The result you need: <b>eligible Canadian dividends are taxed at a lower effective rate than interest income</b>. Interest gets no such break. Capital gains have their own separate treatment — dividends are not taxed as capital gains.",
eg:"$1,000 of interest and $1,000 of Canadian dividends do not leave you with the same amount after tax. The dividends win.",
q:"How are dividends from Canadian corporations taxed?",
o:["The same as interest income","At a lower effective rate because of the dividend tax credit","Exempt if reinvested in the same shares","As capital gains, not income"],
a:1,why:"The dividend tax credit is the whole point of the gross-up. Reinvesting does not defer anything."},

{ch:7,term:"Coupon vs yield",t:"The single most tested bond idea",
teach:"The <b>coupon</b> is fixed at issue as a percentage of face value and never changes. The <b>yield</b> is what you actually earn, given <b>the price you paid</b>.<br><br>So: buy below par and your yield is <b>higher</b> than the coupon. Buy above par and it is lower. Which means <b>bond prices and yields always move in opposite directions</b>. Learn that sentence.",
eg:"A $1,000 bond paying $40 a year: buy it for $900 and you are earning $40 on $900. Better than 4%.",
q:"An investor buys a 4% coupon bond below par. The yield is:",
o:["Equal to the coupon, since the coupon is fixed","Higher than the coupon, because less was paid for the same payments","Lower than the coupon","Impossible to tell without the credit rating"],
a:1,why:"Paying less for the same income stream and the same repayment raises your return. The inverse price-yield relationship is the point."},

{ch:7,term:"Bond risk",t:"Three things that make a bond risky",
teach:"<b>Credit rating</b> — the chance the issuer fails to pay. A weaker issuer must offer a higher yield to compensate; that extra is the <b>credit spread</b>.<br><b>Term</b> — how long until maturity. Longer means more exposure to rate moves.<br><b>Duration</b> — how much the price moves when yields move. Longer duration means bigger swings.<br><br>Duration measures <b>price sensitivity</b>, not default risk. That mix-up is a favourite trap.",
eg:"Rates rise 1%. A short bond barely flinches. A 25-year bond drops noticeably. Same rate move, different duration.",
q:"Two bonds have identical credit ratings but one has longer duration. What follows?",
o:["It will fall further in price if yields rise","It has greater default risk","Duration measures probability of default","It is immune to interest rate risk"],
a:0,why:"Duration is price sensitivity to yield changes. Default probability is what the credit rating is for."},

{ch:7,term:"Yield drivers",t:"What pushes yields up and down",
teach:"Yields rise when money gets more expensive or bonds get less wanted: a <b>central bank rate increase</b>, higher inflation expectations, heavier issuance, or a worsening credit picture.<br><br>Yields fall when demand surges — such as a flight to safety in a downturn — or when rate expectations drop. And remember the mirror: yields up means bond prices down.",
eg:"Bank of Canada hikes. Every existing bond paying the old lower rate becomes less attractive, so its price falls and its yield rises.",
q:"Which is most likely to increase government bond yields?",
o:["Falling inflation expectations","Reduced bond issuance","Increased demand during a downturn","A central bank rate increase to slow demand"],
a:3,why:"Raising the policy rate lifts the whole structure of yields. The other three all push yields down."},

{ch:7,term:"T-bills and STRIPs",t:"Short-term paper and stripped bonds",
teach:"<b>Treasury bills</b> and <b>commercial paper</b> are short-term borrowing. They pay no coupon: you buy them at a <b>discount</b> and get face value at maturity, and that difference is your return. T-bills are government; commercial paper is corporate.<br><br>A <b>STRIP</b> is a bond whose coupons have been separated from its principal and sold individually. Each piece pays nothing along the way and matures at face value — same discount logic, longer horizon.",
eg:"Pay $980 today, get $1,000 in three months. No cheque arrives in between. That is the whole instrument.",
q:"Which statement is correct?",
o:["Treasury bills pay a semi-annual coupon","STRIPs pay no coupon and are bought at a discount to face value","Commercial paper is long-term government debt","STRIPs pay a floating rate"],
a:1,why:"Both T-bills and STRIPs work through the discount rather than a coupon stream. Commercial paper is short-term corporate borrowing."},

{ch:7,term:"Mutual fund",t:"Pooling: the mutual fund",
teach:"A <b>mutual fund</b> pools money from many investors and a manager buys a portfolio with it. You get instant diversification and professional management for a fee, and you can start small.<br><br>Most Canadian funds are <b>mutual fund trusts</b>, which flow income through to you keeping its character — interest stays interest, dividends stay dividends, capital gains stay capital gains, each taxed accordingly. A <b>mutual fund corporation</b> is a company issuing shares instead.",
eg:"$500 buys you a slice of 300 companies. Buying 300 companies directly with $500 is impossible.",
q:"What are the tax considerations of managed products?",
o:["They can be taxed on capital gains, interest and dividends","They are not taxed, so tax does not affect returns","Only dividends are taxed","They are taxed at a flat rate whatever the income type"],
a:0,why:"Income keeps its character as it flows through, so all three types can arise. There is no flat rate and no exemption."},

{ch:7,term:"ETF",t:"ETFs and closed-end funds",
teach:"An <b>exchange-traded fund (ETF)</b> is a fund you buy and sell on an exchange like a share. Units can be continuously created and redeemed, which keeps the <b>market price</b> close to the <b>net asset value (NAV)</b> — the true per-unit value of what the fund holds.<br><br>A <b>closed-ended fund</b> issues a <b>fixed number of units</b> at launch. After that you buy from other investors, so the price can drift to a <b>premium or discount</b> to NAV.",
eg:"An ETF trading at $20.01 with a NAV of $20.00 is normal. A closed-end fund trading at $17 with a NAV of $20 is also normal.",
q:"What distinguishes closed-ended funds from ETFs?",
