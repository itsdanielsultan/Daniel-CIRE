o:["They have a fixed number of shares available","They are not listed on exchanges","Their shares are continuously issued and redeemed","They return principal to investors"],
a:0,why:"The fixed unit count is why discounts and premiums to NAV persist. Continuous creation and redemption describes the ETF."},

{ch:7,term:"Fund Facts",t:"Where clients get real information",
teach:"<b>Fund Facts</b> (mutual funds) and <b>ETF Facts</b> (ETFs) are short, plain-language documents setting out what the fund holds, its risk ranking, past performance and its costs. They must be delivered to the client, and they are the correct information source.<br><br>Blogs, forums, social media and news commentary are not. For government bond data, the primary source is the <b>Bank of Canada</b>.",
eg:"If an exam option offers 'investment forums' or 'blogs written by investors', it is wrong by construction.",
q:"Which is the key information source for a client evaluating a mutual fund?",
o:["Local news outlets","The Fund Facts document","Social media investment forums","Blogs by other investors"],
a:1,why:"Fund Facts is the regulated disclosure document, designed for exactly this and required to be delivered."},

{ch:7,term:"Wrap and hedge funds",t:"Wrap funds, income trusts, hedge funds",
teach:"A <b>wrap fund</b> or fund of funds bundles a whole portfolio under a <b>single fee</b> instead of charging separately for each piece — convenient, but watch for fee layering on top of the underlying funds' costs.<br><br>An <b>income trust</b> holds cash-generating assets and <b>distributes most of its cash flow</b>, hence high yields. High payouts are not safety.<br><br><b>Hedge funds</b> use leverage, short selling and derivatives, and are sold only to investors who qualify under exemptions. Their downsides: <b>high fees</b> and <b>limited liquidity</b> with lock-ups.",
eg:"A hedge fund may only let you withdraw quarterly, with notice. That is the liquidity cost people forget.",
q:"What is a key disadvantage of hedge funds?",
o:["They are marketed to everyone regardless of experience","They must beat the market with less risk","They often charge higher fees and offer limited liquidity","They must publish holdings at all times"],
a:2,why:"Fees and illiquidity are the real costs. Access is restricted through exemptions, and they are not required to publish holdings."},

{ch:7,term:"Options",t:"Derivatives part one: options",
teach:"A <b>derivative</b> is a contract whose value comes from something else — a share, an index, a commodity. You never own the underlying thing.<br><br>An <b>option</b> gives the holder a <b>right, not an obligation</b>, to buy or sell at a set <b>strike price</b>. A <b>call</b> is the right to buy; a <b>put</b> is the right to sell. You pay a <b>premium</b> for it. <b>American-style</b> options can be exercised any time up to expiry; <b>European-style</b> only on the expiry date.",
eg:"Pay $2 for the right to buy at $50. If it hits $60 you exercise. If it never does, you lose the $2 and nothing more.",
q:"What is a key characteristic of American-style options?",
o:["They can be exercised only on the expiry date","They can be exercised any time up to and including expiry","They are cheaper than European options","They trade only on North American exchanges"],
a:1,why:"Style is about timing, not geography. More flexibility generally means a higher premium, not a lower one."},

{ch:7,term:"Futures",t:"Derivatives part two: futures and margin",
teach:"A <b>future</b> is standardised, exchange-traded, and an <b>obligation</b> on both sides to buy or sell at a set price on a set date. No walking away. Settlement may be <b>cash or physical delivery</b>, depending on the contract.<br><br><b>Margin</b> here is not a down payment. It is collateral deposited to open and maintain the position, and positions are <b>marked to market</b> daily — a fall triggers a call for more collateral.<br><br><b>Listed</b> derivatives are centrally cleared. <b>OTC</b> derivatives are bespoke, with more <b>liquidity risk</b> and more <b>counterparty risk</b>.",
eg:"You post $5,000 to control $100,000 of exposure. That is leverage, and it cuts both ways daily.",
q:"What best describes margin in futures trading?",
o:["The market value of the underlying asset","The total needed to close the position","Full payment upfront for the contract value","Collateral deposited to open and maintain the position and cover potential losses"],
a:3,why:"Margin is a fraction of contract value, which is exactly where the leverage comes from. Paying in full would remove it."},

{ch:8,term:"Conflict of interest",t:"What a conflict of interest is",
teach:"A <b>conflict of interest</b> exists whenever what is good for you or your firm is not the same as what is good for the client. Conflicts are normal and unavoidable — being paid at all creates one.<br><br>The rule is an <b>order of operations</b>: <b>avoid</b> conflicts that cannot be addressed in the client's best interest; otherwise <b>address</b> them with controls; and <b>disclose</b> them clearly. Disclosure alone never rescues a conflict that cannot be managed.",
eg:"Two suitable funds, one paying you triple. The conflict is real. What you do next is what the rules judge.",
q:"A conflict cannot be satisfactorily addressed under the rules. What must happen?",
o:["It must be minimised","It must be avoided","The client must be released","The client must be investigated"],
a:1,why:"Avoidance is mandatory when a conflict cannot be addressed. Minimising still leaves the client exposed, and disclosure is not a cure."},

{ch:8,term:"Personal dealing",t:"Conflicts you will actually meet",
teach:"Four common ones and their answers.<br><br><b>Proprietary products</b> — recommending your own firm's fund is allowed, but is a conflict, because a third-party product may suit the client better.<br><b>Referral fees</b> — need the <b>firm's approval first</b>, then disclosure.<br><b>Personal holdings</b> — <b>disclose</b> your ownership and let the client decide.<br><b>Personal financial dealing</b> — borrowing from or lending to clients, taking payment directly, or settling a complaint from your own pocket are all <b>prohibited</b>. The narrow exception is acting under a power of attorney for a family member.",
eg:"Paying a client out of your own money to make a complaint disappear hides it from the firm and the regulator. That is why it is banned.",
q:"Which complies with the rules on personal financial dealing?",
o:["Taking payment directly from a client for services","Settling a complaint from personal funds","Accepting a client guarantee for a personal loan","Acting under a power of attorney for a Related Person"],
a:3,why:"The family power of attorney is the recognised exception, with disclosure and firm approval. The other three are the classic prohibitions."},

{ch:8,term:"Market abuse",t:"The four named abuses",
teach:"<b>Front running</b> — trading ahead of a client order you know about, to profit from the move it will cause.<br><b>Insider trading</b> — trading on <b>material non-public information</b> about the issuer. If you receive it by accident: do not trade, do not tell anyone, escalate to <b>compliance</b>.<br><b>Churning</b> — excessive trading to generate commission.<br><b>Manipulation</b> — creating a false impression of price or volume. The classic is the <b>wash trade</b>, where orders match against yourself and there is <b>no change in beneficial ownership</b>.",
eg:"Front running abuses knowledge of the order. Insider trading abuses knowledge of the company. Different sins.",
q:"An IR knows a client will buy 10,000 shares and buys 1,000 for themselves first. This is:",
o:["Front running","Market manipulation","Insider trading","Unauthorized trading"],
a:0,why:"The abused information is the pending client order, not confidential company information. That makes it front running."},

{ch:8,term:"Gatekeeping",t:"Best execution and gatekeeping",
teach:"<b>Best execution</b> means using reasonable efforts to get the <b>most advantageous terms reasonably available</b> — price, speed, certainty and total cost together, not price alone. In practice that means using the firm's desks, routing and algorithms across venues.<br><br><b>Gatekeeper obligations</b> make you the first line of defence: notice activity that is odd for that client, and <b>escalate and report</b> it. You are not asked to prove wrongdoing. You are asked to notice.",
eg:"Algorithmic orders get no special treatment — same rules as a manual order, with human supervision required.",
q:"What is the primary purpose of gatekeeping obligations under UMIR?",
o:["To monitor trade execution","To restrict certain securities to qualified investors","To prevent and identify suspicious transactions and market abuse","To facilitate clearing and settlement"],
a:2,why:"Detection and prevention of abuse. It is why knowing a client's normal pattern is part of the job."},

{ch:8,term:"Complaints",t:"When a client complains",
teach:"A <b>service complaint</b> — rudeness, a late statement — is handled internally and is <b>not reported externally</b>. A complaint alleging <b>misconduct</b> — unsuitable advice, unauthorised trading, misrepresentation, theft — <b>must be reported to CIRO</b>.<br><br>The firm has a maximum of <b>90 days</b> to give a substantive response, and keeps complaint records for <b>seven years</b> from receipt. If the client is still unhappy, they can go to <b>OBSI</b> (free, independent, recommends compensation) or <b>CIRO arbitration</b> (binding, better suited to more complex disputes).",
eg:"Client complains the advice was unsuitable: reportable. Client complains you were short on the phone: not reportable, still handle it.",
q:"What is the maximum time to provide a substantive response to a complaint?",
o:["30 days","60 days","90 days","120 days"],
a:2,why:"Ninety days. Miss it and the client can escalate anyway, and the delay becomes its own compliance failure."},

{ch:8,term:"Ethics",t:"Where the rules run out",
teach:"Rules are <b>precise but finite</b>. They cannot anticipate every situation. Ethics are <b>general obligations</b> that still apply when the rulebook is silent or ambiguous — which is exactly why the exam tests judgement, not just recall.<br><br>Two consequences worth carrying into the exam. Following a firm instruction is <b>never</b> a defence for harming a client: decline for that client and explain why to the firm. And when you make an error, <b>tell the client and document it</b> — never rewrite the record, never trade to win the loss back.",
eg:"'My manager told me to' is not an answer the exam ever accepts. Neither is 'the trade was reversed, so I deleted it'.",
q:"Why does the industry emphasise ethics alongside rules?",
o:["Rules are not binding without ethical statements","Ethics are more specific than rules","Rules come from personal values, ethics are precise","Ethical practice still applies where rules fall short"],
a:3,why:"Ethics fills the gaps rules cannot foresee. Note the direction: rules are the precise ones, ethics the general ones."}
];
const BANK = [
{el:1,cite:"1.1 · CSA",teach:"Canada has <b>no national securities regulator</b>. Each province and territory runs its own commission, and the <b>Canadian Securities Administrators (CSA)</b> is the umbrella body they use to harmonize rules — it is a coordinating council, not a super-regulator with its own statute.",
q:"A dealer operating in Ontario, Alberta and Quebec complains that it has to deal with three commissions. What does the CSA actually do for it?",
o:["Replaces the provincial commissions with a single federal licence","Coordinates and harmonizes rules across the provincial and territorial regulators","Enforces UMIR on Canadian equity marketplaces","Insures client assets if the dealer becomes insolvent"],
a:1,why:"The CSA is a voluntary umbrella of the provincial and territorial regulators. It publishes harmonized National Instruments and policies, but registration and enforcement powers still sit with each member commission. UMIR is CIRO's; insolvency cover is CIPF's."},

{el:1,cite:"1.1 · Instruments",teach:"CSA output comes in tiers. A <b>National Instrument (NI)</b> is law once adopted in each jurisdiction. A <b>Multilateral Instrument (MI)</b> is the same thing but only some jurisdictions signed on. A <b>Companion Policy (CP)</b> explains how the regulator interprets an instrument, and <b>staff notices</b> flag concerns — neither CP nor staff notice is binding law on its own.",
q:"Your compliance officer cites a Companion Policy to justify a procedure. How should that be characterized?",
o:["Binding law with the same force as the National Instrument it accompanies","Regulatory interpretation and guidance on how the instrument is applied","A rule that only applies in the provinces that adopted it","An enforcement order issued against a specific registrant"],
a:1,why:"Companion Policies tell you how regulators read an instrument. They carry real weight in practice, but the legal force sits in the instrument itself. Partial adoption across jurisdictions describes a Multilateral Instrument, not a CP."},

{el:1,cite:"1.2 · CIRO",teach:"<b>CIRO</b> is the pan-Canadian <b>self-regulatory organization</b>: it oversees Investment Dealers, Mutual Fund Dealers and all trading on Canada's debt and equity marketplaces. It writes two main rule books — the <b>IDPC Rules</b> (how a dealer runs its business and treats clients) and <b>UMIR</b> (how orders and trades must behave in the market).",
q:"A supervisor is looking for the rule that governs how a client's order must be handled to achieve best execution. Which book, and why?",
o:["IDPC Rules, because they cover all conduct by a dealer's employees","UMIR, because it governs order handling and trading on marketplaces","National Instrument 45-106, because it governs order flow","The Bank Act, because dealers are deposit-taking institutions"],
a:1,why:"Split them by subject: IDPC = business conduct and client accounts (KYC, suitability, complaints, capital). UMIR = market integrity (best execution, manipulative practices, front running, gatekeeping). Best execution is a UMIR concept."},

{el:1,cite:"1.3 · Registration",teach:"Two bodies touch approval. The <b>CSA member commission registers</b> the firm and individuals under securities law; <b>CIRO approves</b> individuals in categories such as Registered Representative or Investment Representative and admits the firm as a Dealer Member. In practice CIRO now performs delegated registration functions, but the statutory authority remains provincial.",
q:"An applicant asks who has the statutory power to grant or refuse their registration as a registered individual.",
o:["CIRO alone, since it is the self-regulatory organization","The provincial or territorial securities commission, under securities legislation","The Office of the Superintendent of Financial Institutions","FINTRAC, following its due diligence check"],
a:1,why:"Registration is a creature of provincial securities law, so the commission holds the statutory power even where CIRO carries out the work and imposes its own approval requirements on top. OSFI supervises banks and insurers; FINTRAC handles AML reporting."},

{el:1,cite:"1.4 · Marketplaces",teach:"Four venue types. An <b>exchange</b> lists securities and sets listing standards. An <b>alternative trading system (ATS)</b> matches orders but does not list. A <b>crypto-asset trading platform (CTP)</b> trades crypto assets or contractual rights to them. A <b>foreign organized regulated market (FORM)</b> is an overseas venue recognized as adequately regulated.",
q:"A venue matches buy and sell orders in already-listed Canadian equities but has no listing standards of its own. What is it?",
o:["An exchange","An alternative trading system","A clearing agency","A foreign organized regulated market"],
a:1,why:"The listing function is the dividing line: an ATS provides execution without listing securities. Clearing agencies do not match orders at all — they settle them after the fact."},

{el:1,cite:"1.5 · Clearing",teach:"After a trade is agreed, someone has to make delivery and payment actually happen. <b>CDS (the Canadian Depository for Securities)</b> clears and settles securities trades and holds them in a central depository. The <b>CDCC (Canadian Derivatives Clearing Corporation)</b> does the same job for exchange-traded derivatives, standing as central counterparty.",
q:"Which pairing is correct?",
o:["CDS settles securities trades; CDCC clears exchange-traded derivatives","CDS regulates marketplaces; CDCC registers dealers","CDS insures client assets; CDCC investigates market abuse","CDS approves prospectuses; CDCC approves derivative products"],
a:0,why:"Both are plumbing, not policing. CDS is the securities depository and settlement system; CDCC is the clearing house for listed derivatives. Investor protection is CIPF, prospectus review is the CSA."},

{el:1,cite:"1.6 · CIPF",teach:"The <b>Canadian Investor Protection Fund</b> covers one specific disaster: your dealer goes <b>insolvent</b> and your property is missing. It restores property held by the member within defined limits and helps pool customer assets in a bankruptcy. It does <b>not</b> cover investment losses, bad advice, or a stock that simply fell.",
q:"A client's portfolio has dropped 40% after a bad recommendation and the dealer is still solvent. What can CIPF do?",
o:["Reimburse the market loss caused by the unsuitable advice","Nothing — CIPF covers property missing on a member insolvency, not investment losses","Order the dealer to compensate the client","Refer the file to FINTRAC for restitution"],
a:1,why:"CIPF is insolvency coverage, not performance or suitability insurance. The client's route for a suitability complaint is the dealer's complaint process, then OBSI, CIRO arbitration or litigation."},

{el:1,cite:"1.7 · Other agencies",teach:"Learn these by their beat. <b>FSRA</b> — Ontario pensions, insurance, credit unions and mortgage brokers. <b>OSFI</b> — prudential supervision of federally regulated banks, insurers and pension plans. <b>FINTRAC</b> — receives and analyzes money-laundering and terrorist-financing reports. <b>IMET</b> — RCMP teams that investigate serious capital markets crime. <b>OBSI</b> — free dispute resolution for clients.",
q:"Which of these is the correct beat?",
o:["FSRA supervises Investment Dealers' trading conduct","OSFI receives suspicious transaction reports from dealers","FINTRAC analyzes reports on money laundering and terrorist financing","IMET operates the national investor compensation fund"],
a:2,why:"FINTRAC is the financial intelligence unit that receives STRs and large cash transaction reports. Dealer conduct is CIRO's; OSFI is a prudential supervisor of federally regulated institutions; IMET investigates capital markets crime and pays out nothing."},

{el:1,cite:"1.10 · PCMLTFA",teach:"Money laundering runs in three stages: <b>placement</b> (dirty cash enters the system), <b>layering</b> (transactions obscure the trail) and <b>integration</b> (funds re-emerge looking legitimate). A <b>politically exposed person (PEP)</b> — someone holding or connected to a prominent public role — is not banned as a client, but triggers <b>enhanced ongoing due diligence</b>, senior management review and source-of-funds inquiry.",
q:"A dealer determines that an existing client has become a politically exposed person. What does the PCMLTFA require?",
o:["Apply simplified due diligence, since the client is already known","Take enhanced ongoing due diligence measures and monitor for suspicious activity","Terminate the relationship and file a suspicious transaction report","Freeze the account and notify the CSA"],
a:1,why:"PEP status raises the risk rating; it does not by itself mean wrongdoing. You escalate diligence and monitoring. An STR is filed only where there are reasonable grounds to suspect a transaction relates to a money-laundering or terrorist-financing offence."},

{el:1,cite:"1.11 · Other laws",teach:"Round out the statute list. <b>PIPEDA</b> governs how client personal information is collected, used and safeguarded. <b>CASL</b> governs commercial electronic messages. The <b>Bank Act</b> regulates the operation and stability of banks. <b>BIA Part XII</b> deals with the bankruptcy of a securities firm. On records: FINTRAC's baseline is five years, but <b>CIRO requires client records to be kept seven years</b>, with the two most recent years readily accessible — the tighter rule wins.",
q:"How long must an Investment Dealer keep client relationship records under CIRO's requirements?",
o:["Five years from the end of the client relationship","Seven years from the date the record is created","Three years from the closing of the account","Indefinitely, unless the client requests deletion"],
a:1,why:"Seven years from creation is the CIRO retention period, and the practice exam keys to it. Five years from the end of the relationship is the FINTRAC baseline — when two rules overlap, comply with the stricter one."},

{el:2,cite:"2.1 · CRM",teach:"The <b>client relationship model</b> has four load-bearing pillars: <b>relationship disclosure</b> (what you offer and how it works), <b>conflicts of interest</b> management and disclosure, <b>suitability assessment</b>, and <b>account performance reporting</b>. Everything in onboarding hangs off one of these four.",
q:"Which of the following is NOT one of the client relationship model pillars?",
o:["Relationship disclosure","Conflicts of interest management and disclosure","A guarantee of minimum investment performance","Account performance reporting"],
a:2,why:"No pillar promises returns. The model is about transparency, conflict handling, suitability and honest reporting — precisely so that performance is never guaranteed or implied."},

{el:2,cite:"2.2 · Institutional",teach:"An <b>institutional client</b> qualifies by category, not by feeling sophisticated: accepted counterparties, accepted institutions, <b>regulated entities</b>, registrants other than individual registrants, a <b>non-individual with over $10 million</b> in securities and precious metals bullion under administration, an <b>individual over $10 million who requests and consents</b>, or a hedger who requests and consents for qualifying hedge accounts.",
q:"A corporation with $14 million in securities under administration opens an account. How is it classified?",
o:["Retail client, because only regulated entities can be institutional","Institutional client, on the non-individual $10 million threshold","Retail client until it signs a permitted client waiver","Institutional client only if it also requests and consents"],
a:1,why:"For a non-individual, crossing $10 million is enough on its own. The request-and-consent step is what an individual over $10 million must add, and what a hedger must add for qualifying hedge accounts."},

{el:2,cite:"2.3 · Retail vs institutional",teach:"Classification changes the paperwork, not the ethics. Institutional clients can be assessed for <b>sophistication</b> and may fall outside retail suitability determination; relationship disclosure is not required for them in the retail form. But the dealer still owes fair dealing, and know-your-client obligations for identity and AML never disappear.",
q:"What is one real consequence of being classified as an institutional client?",
o:["Exemption from every know-your-client requirement","Suitability determination requirements may not apply in the retail form","Automatic access to lower-fee products","A right to have complaints handled outside any process"],
a:1,why:"The relief is targeted: retail suitability determination and retail-style relationship disclosure. Identity verification, AML and record-keeping still bind, and institutional complaints still need documented handling procedures."},

{el:2,cite:"2.4 · NI 45-106",teach:"Selling securities normally means filing a <b>prospectus</b> — the full disclosure document. <b>National Instrument 45-106</b> is the rule that sets out the <b>exemptions</b> from preparing and filing one, the best known being the <b>accredited investor</b> category based on income, financial assets or net assets.",
q:"What does NI 45-106 actually cover?",
o:["The prescribed content of a prospectus","The requirement to produce a prospectus","The exemptions from preparing and filing a prospectus","A regulatory guarantee on accepted prospectuses"],
a:2,why:"45-106 is the exemptions instrument — think 45-106 equals the side door. Regulators never guarantee a prospectus; clearing it means disclosure was adequate, not that the investment is sound."},

{el:2,cite:"2.6 · KYC",teach:"Retail KYC is broader than money. You collect the client's <b>personal circumstances</b>, <b>financial circumstances</b>, <b>investment knowledge</b>, <b>risk profile</b>, <b>investment objectives and needs</b>, and <b>time horizon</b>. Dropping personal circumstances or knowledge is the classic wrong answer.",
q:"Which set best reflects the KYC information required from a retail client?",
o:["Financial circumstances, investment knowledge, objectives and risk profile","Personal and financial circumstances, investment knowledge, needs, objectives and risk profile","Existing portfolio, current income and outgoings, and attitude to risk","Overall financial circumstances, given the services to be supplied"],
a:1,why:"The complete set includes personal circumstances and needs alongside the financial picture. Age, dependants, employment and health of income all shape what is suitable, not just the balance sheet."},

{el:2,cite:"2.6 · Risk profile",teach:"The risk profile has two halves that get confused. <b>Risk tolerance</b> is willingness — how much volatility the client can stomach. <b>Risk capacity</b> is ability — how much loss the client could absorb without wrecking the plan. The profile is set by the <b>lower</b> of the two.",
q:"A client says they are comfortable with big swings, but they need the money for a house deposit in 18 months. What governs?",
o:["Risk tolerance, because the client's stated comfort is decisive","Risk capacity, because the ability to absorb loss is the binding constraint","Neither — the client can waive the risk profile in writing","Whichever the client selects on the questionnaire"],
a:1,why:"Willingness cannot manufacture ability. A short horizon and an earmarked purpose cap capacity, and the profile follows the more restrictive of the two. Retail clients cannot waive suitability by preference."},

{el:2,cite:"2.7 · TCP",teach:"A <b>trusted contact person (TCP)</b> is someone the <b>client names</b> and consents in writing for the dealer to contact — typically where there are signs of financial exploitation, diminished mental capacity, or the client cannot be reached. The TCP gets no trading authority and no right to see the account.",
q:"Which describes a trusted contact person?",
o:["A person appointed by the dealer whom the client may call","An individual identified by the client whom the dealer may contact with the client's written consent","A lawyer retained by the dealer under the client agreement","A person authorized to approve trades if the client is unavailable"],
a:1,why:"The client chooses, and consents in writing. Compare a power of attorney, which does carry authority to act — the TCP is a resource for concern, not a decision-maker."},

{el:2,cite:"2.7 · Third parties",teach:"Other people orbit a client's finances: <b>powers of attorney</b> (legal authority to act), lawyers, accountants, insurance agents, and the TCP. The dealer's job is to <b>identify and document</b> each role, because authority to instruct the account is a very different thing from being consulted.",
q:"A client's daughter holds a power of attorney and calls in a trade. What is the dealer's position?",
o:["Refuse — only the client can ever instruct the account","Act on it, provided the power of attorney is documented on file and covers the authority claimed","Act on it because family members are presumed authorized","Treat her as the trusted contact person"],
a:1,why:"A POA can carry genuine authority, but it must be documented and its scope checked. Presuming authority from a family relationship, or confusing a POA with a TCP, is where dealers get into trouble."},

{el:2,cite:"2.9 · Costs",teach:"Three drags compound against a client: <b>fees</b>, <b>turnover</b> (each trade costs, and frequent trading multiplies the cost) and <b>taxes</b>. Fees do not merely nibble at returns — they reduce the base that compounds, so their effect grows with time.",
q:"Which statement about fees is correct?",
o:["Fees can enhance returns if managed properly","Fees reduce the client's overall investment returns","Fees have no significant impact over the long term","Fees affect only short-term returns"],
a:1,why:"Fees are a straight subtraction from return, and the long term is where they hurt most because of lost compounding. This is exactly why cost must be considered in product selection."},

{el:2,cite:"2.10 · Disclosure",teach:"The account agreement and firm welcome package carry the <b>fee schedule</b>, the <b>CIRO account opening brochure</b>, <b>conflict of interest disclosures</b> and <b>complaint handling procedures</b>. The relationship disclosure itself must be in <b>plain language</b> and carry the title relationship disclosure so a client can find it.",
q:"Which statement about the relationship disclosure is true?",
o:["It rests on preliminary conversations between client and dealer","It must be in plain language and bear the title relationship disclosure","It is limited to four sides of paper","It must be posted, signed and returned by the client"],
a:1,why:"Plain language and a clear title are the requirements — there is no page limit and no mandated wet signature by post. The point is that the client can actually locate and understand it."},
{el:3,cite:"3.1/3.2 · RR vs IR",teach:"Two titles, one big difference. A <b>Registered Representative (RR)</b> may give <b>advice and recommendations</b> and manage a client's portfolio. An <b>Investment Representative (IR)</b> takes and enters orders, gives quotes and answers enquiries but is <b>prohibited from making investment recommendations</b>.",
q:"A client asks their Investment Representative whether they should buy a particular bank stock. What is the correct response?",
o:["Give a view, since the IR may share opinions but not formal advice","Decline to recommend — an IR may not make investment recommendations, and refer the client appropriately","Recommend it if it is suitable on the KYC file","Enter the order and document the advice given"],
a:1,why:"The prohibition on recommendations is absolute for an IR, however casually the question is asked. Take the order or route the client to a Registered Representative."},

{el:3,cite:"3.3 · Trust/agency/fiduciary",teach:"Three related ideas. <b>Trust</b> is the client's confidence in the firm. <b>Agency</b> is acting on the client's behalf when arranging execution — the dealer is agent, not owner of the trade. <b>Fiduciary duty</b> is the highest standard: the client's interest above all others, and it bites hardest on <b>managed and discretionary accounts</b>.",
q:"Which statement is true?",
o:["When a dealer arranges execution of a client's order, it acts as agent","When a dealer offers an order execution only account, it acts as trustee","Fiduciary duty requires balancing the client's interest against the dealer's profitability","Principal trades occur where the dealer acts as agent for a fiduciary"],
a:0,why:"Arranging execution for a client is agency. A principal trade is the opposite — the dealer trades from its own inventory as counterparty. And fiduciary duty is not a balancing exercise; the client comes first, full stop."},

{el:3,cite:"3.5 · Service types",teach:"Four retail service levels, easiest sorted by who decides. <b>Order execution only (OEO)</b> — client decides, no advice, no suitability determination. <b>Advisory</b> — the RR recommends, the <b>client approves each trade</b>. <b>Managed / discretionary</b> — the firm decides and trades <b>without prior client approval</b> for each trade.",
q:"An RR recommends a strategy and waits for the client to confirm before proceeding. What account is this?",
o:["A managed account","An order execution only account","An advisory account","A discretionary account"],
a:2,why:"Recommendation plus client sign-off per trade is the signature of an advisory account. If the RR could simply act, it would be managed or discretionary; if no recommendation were permitted at all, it would be OEO."},

{el:3,cite:"3.5 · Managed accounts",teach:"In a <b>managed account</b>, a qualified Portfolio Manager exercises <b>discretion</b>: investment decisions are made and executed without seeking the client's approval trade by trade. The client sets the mandate and KYC; the manager owes a <b>fiduciary duty</b> within it.",
q:"Which is a key feature of a managed account?",
o:["The client retains authority over every trade","The dealer is authorized to make investment decisions without prior client approval","Only fixed income products may be held","Each trade must be pre-approved in writing"],
a:1,why:"Discretion is the defining feature — and the reason managed accounts attract fiduciary duty and heavier supervision. Trade-by-trade approval describes advisory."},

{el:3,cite:"3.6 · Institutional services",teach:"Institutional desks sell a different menu: <b>trading</b>, <b>research</b>, <b>underwriting</b>, <b>merger and acquisition advice</b>, <b>prime brokerage</b> (financing, clearing and custody bundled for funds) and <b>securities lending</b>. Retail investors typically get advice, execution and managed products instead.",
q:"Which service is most likely offered to an individual retail investor?",
o:["Prime brokerage services","Securities lending services","Investment advice services","Merger and acquisition advisory"],
a:2,why:"Prime brokerage, institutional securities lending and M&A advisory are wholesale services built for funds and corporates. Advice is the core retail offering."},

{el:3,cite:"3.7/3.10 · Appropriateness",teach:"Two different tests. <b>Account appropriateness</b> asks whether the <b>type of account and service</b> fits the client — is OEO or a margin account the right container at all? It is assessed at account opening and on material change. <b>Suitability determination</b> is trade and portfolio level: does this action suit the KYC and put the client's interest first?",
q:"Which best describes how a dealer complies with account appropriateness?",
o:["Consider whether each individual trade is appropriate","Balance the interests of client and dealer on a risk basis","Ask the client to unwind an execution-only order it thinks is unwise","Explain the features and costs of the different account types so the right one is chosen"],
a:3,why:"Appropriateness is about matching the client to the right kind of account and service, which requires explaining what each type does and costs. Trade-level judgement is the suitability obligation."},

{el:3,cite:"3.8/3.9 · Due diligence & KYP",teach:"Two layers before anything reaches a client. <b>Product due diligence</b> is the <b>firm's</b> gate: it assesses risks, structure and costs before approving a security for the shelf. <b>Know-your-product (KYP)</b> is the <b>Approved Person's</b> duty to understand each investment they buy, sell or recommend — structure, features, risks, and initial and ongoing costs plus their impact.",
q:"What must a dealer do before making a security available to clients under the product due diligence obligation?",
o:["Confirm the security is listed on a major exchange","Assess the security's risks, structure and costs","Verify that an analyst has recommended it","Check that it offers good value for money"],
a:1,why:"The firm assesses risk, structure and cost. It is not asked to bless the security as good value — that judgement belongs to the suitability and KYP analysis for a specific client."},

{el:3,cite:"3.11 · Suitability",teach:"The retail suitability rule now carries an explicit <b>client-first</b> standard: the dealer must put the <b>client's interest ahead of its own</b> and the firm's, considering the account, any relevant household context, and the portfolio as a whole — not just the trade in isolation.",
q:"Which is a fundamental requirement of the suitability rules for retail clients?",
o:["Any action puts the client's interest first","The client understands how securities markets work","The client can afford the associated charges","The client understands the derivatives market"],
a:0,why:"Client-first is the anchor. Affordability and client understanding matter as inputs, but the governing principle is that the dealer's or representative's interest never outranks the client's."},

{el:3,cite:"3.13 · Exemptions",teach:"Suitability determination has carve-outs by <b>account type</b>, <b>service type</b> and <b>client type</b>. The clearest: <b>order execution only</b> accounts (no recommendation, so no suitability determination), <b>direct electronic access</b>, and <b>permitted clients</b> who waive in writing. Identity and AML obligations survive every exemption.",
q:"For which account is a dealer exempt from collecting a client's investment needs and objectives?",
o:["A financial derivatives account","A margin account","An RRSP","A direct electronic access account"],
a:3,why:"DEA and OEO relationships are execution-only channels with no advice, so the needs-and-objectives collection is not required. Margin accounts and RRSPs are ordinary advised accounts — and derivatives accounts require more diligence, not less."},

{el:3,cite:"3.14 · Escalation",teach:"When a client wants something outside your approval or expertise, the answer is <b>escalate or refer</b> — never improvise. Options and other derivatives require specific qualification, and firms keep internal subject matter experts precisely for these moments.",
q:"A client of an unqualified Investment Representative wants to trade options. What should the IR do?",
o:["Proceed with the trades as instructed to achieve best execution","Refer the client to a representative approved to trade derivatives","Tell the client options trades simply cannot be done at the firm","Suggest a different investment the IR does understand"],
a:1,why:"Referral serves the client and respects the proficiency rules. Refusing outright misleads the client, and steering them to a substitute product because it suits your knowledge is a conflict dressed as helpfulness."},

{el:3,cite:"3.15 · Styles",teach:"<b>Passive management</b> replicates an index and keeps costs low; <b>active management</b> selects securities to beat a benchmark and charges more for the attempt. This applies to bonds as much as equities: a passive fixed income portfolio tracks a bond index rather than trading on rate views.",
q:"A client wants low cost and returns that follow a benchmark. Which fixed income approach fits?",
o:["Active management, selecting bonds on predicted performance","Passive management, replicating a bond market index","Active management, trading frequently to capture rate moves","Passive management, with frequent strategic shifts to beat the market"],
a:1,why:"Replicating the index is the definition of passive. Option D is a contradiction — attempting to outperform through frequent shifts is active management wearing the wrong label."},

{el:3,cite:"3.15 · Fees",teach:"Because active strategies pay for research, analysts and trading, their <b>management fees are typically higher</b> than passive equivalents. That fee gap is the hurdle an active manager must clear before the client is better off.",
q:"How do management fees for active strategies usually compare with passive?",
o:["Higher than passive","Lower than passive","The same as passive","They vary directly with market performance"],
a:0,why:"Higher, reliably. Fees that move with performance describe performance fees, which are a feature of hedge funds and some alternatives rather than the standard management fee."},

{el:3,cite:"3.16 · Benchmarks",teach:"A <b>benchmark</b> is a yardstick — usually an index — used to judge whether a portfolio did well relative to its market. If a firm uses benchmarks in client reporting, the <b>relationship disclosure must explain how they are used</b> to assess performance.",
q:"Which is true about performance benchmarks in client reporting?",
o:["They may be used if set out in the firm's general online terms","They are permitted only for advisory accounts","They require client consent and risk committee approval","The relationship disclosure must explain how they are used to assess performance"],
a:3,why:"Disclosure is the requirement: the client should understand what the comparison means. Burying it in general online terms does not count as telling the client."},

{el:3,cite:"3.4 · KYC updates",teach:"KYC is a living file. Refresh it when there is a <b>significant change</b> — a material shift in financial circumstances, employment, marital status, objectives, or risk tolerance. Routine activity like a small withdrawal or a regular monthly contribution is not, by itself, a trigger.",
q:"Which event triggers a KYC update?",
o:["The client withdraws 5% of the account value","The client considers switching from low to high risk assets","The client makes regular monthly contributions to savings","The client experiences a significant change in financial situation"],
a:3,why:"A significant change in circumstances is the trigger. Merely considering a change of strategy is a conversation, not a KYC event — though if the client acts on it, the risk profile has to be reassessed first."},

{el:3,cite:"3.17 · Foreign clients",teach:"A client who moves to the <b>United States or another foreign jurisdiction</b> may bring that jurisdiction's registration requirements with them. Dealers must follow set procedures — which can mean restricting the account, obtaining a foreign registration, or transferring the relationship — rather than carrying on unchanged.",
q:"A long-standing client relocates permanently to the United States. What should the dealer do?",
o:["Nothing — the account was opened lawfully in Canada","Apply its procedures for clients in foreign jurisdictions, since US requirements may now apply","Close the account immediately and remit the proceeds","Reclassify the client as institutional"],
a:1,why:"Securities registration follows where the client is, so the firm applies its cross-border procedures. Neither ignoring the move nor abruptly closing the account is the prescribed answer."},
{el:4,cite:"4.4 · Reportable",teach:"Not every grumble is a regulatory event. A <b>service complaint</b> — rudeness, a slow callback, a statement that arrived late — is handled internally and is <b>not externally reportable</b>. Complaints alleging <b>misconduct</b> — unsuitable advice, unauthorized trading, misrepresentation, fraud, theft, misappropriation — must be reported to CIRO.",
q:"A client complains that an employee was rude on the phone. Is this reported externally to the regulator?",
o:["No — this is a non-reportable service complaint","Yes — all client complaints are reportable","No — it is not a valid complaint at all","Yes — service quality is a conduct matter"],
a:0,why:"Rudeness is a service issue: log it, handle it, do not report it. It is still a valid complaint the firm must address — dismissing it as invalid is the other trap in this question."},

{el:4,cite:"4.4 · Response time",teach:"Once a complaint arrives, CIRO gives the dealer a maximum of <b>90 calendar days</b> to provide a <b>substantive response</b> — a decision with reasons and an outline of the client's further options. An acknowledgement letter goes out much sooner, but the clock that matters here is 90 days.",
q:"What is the maximum time allowed to provide a substantive response to a client complaint?",
o:["30 days","60 days","90 days","120 days"],
a:2,why:"Ninety days. Miss it and the client can escalate anyway — and the failure itself becomes a compliance issue."},

{el:4,cite:"4.6 · Records",teach:"Complaint records must be kept for <b>seven years from receipt</b> of the complaint. Firms need written policies covering how complaints are received, investigated, resolved, recorded and reported, and those procedures must address <b>both retail and institutional</b> clients — the processes differ, but neither is left to improvisation.",
q:"Which is true about handling institutional versus retail complaints?",
o:["The rules are identical for both","Rules apply to both, but the exact processes differ","The dealer may decide freely what to do with institutional complaints","There are no specific institutional processes, only a duty to act fairly"],
a:1,why:"Both are covered by rules; the retail process is more prescriptive. There is no free-for-all for institutional complaints, and pretending the two regimes are identical is equally wrong."},

{el:4,cite:"4.2 · OBSI",teach:"The <b>Ombudsman for Banking Services and Investments</b> is the free, independent escalation route. It steps in <b>after the firm and client cannot resolve the matter themselves</b> — typically once the firm has responded or run out its 90 days. It investigates and recommends compensation; it is not a first port of call.",
q:"At what stage does OBSI get involved?",
o:["When a firm is drafting its complaints policies","When a complaint is first made to the firm","When the firm has drafted a response but not yet sent it","When the firm and client cannot resolve the complaint themselves"],
a:3,why:"OBSI is the escalation valve, not the intake desk. The client must complain to the firm first and give it its chance to respond."},

{el:4,cite:"4.2 · Arbitration",teach:"<b>CIRO's arbitration program</b> is the route for disputes that need a binding decision from an independent arbitrator — better suited to <b>more complex</b> or higher-value claims, where evidence must be weighed and the parties want finality. Simple, small-value matters are usually resolved by the firm or through OBSI.",
q:"The CIRO arbitration program is most suitable for which type of complaint?",
o:["More complex disputes","Very simple disputes","Low value disputes","Disputes over fees only"],
a:0,why:"Complexity and the need for a binding determination point to arbitration. Straightforward or small claims are quicker and cheaper through the firm's process or OBSI."},

{el:4,cite:"4.7 · Settlements",teach:"A representative may <b>not settle a complaint privately</b>. Paying a client out of personal funds, or agreeing terms without the dealer's approval, is a prohibited practice — it hides misconduct from the firm and the regulator and is a form of personal financial dealing.",
q:"A representative offers to reimburse a client's loss personally to make a complaint go away. This is:",
o:["Acceptable, since the client is made whole","Acceptable if disclosed to the client in writing","Prohibited — settlements require the dealer's approval and personal payments are prohibited dealing","Required, where the representative caused the loss"],
a:2,why:"The settlement must go through the firm. Private payments conceal the complaint from supervision and reporting, which is why they are banned regardless of good intentions."},

{el:5,cite:"5.1 · Theories",teach:"Three schools in one line each. <b>Keynesian</b> — government spending manages demand through downturns. <b>Monetarist</b> — control the money supply and inflation follows. <b>Supply-side</b> — cut taxes and regulation to raise output. They disagree mainly about which lever moves the economy.",
q:"Which pairing is correct?",
o:["Keynesian theory holds that managing the money supply is the primary lever","Monetarist theory emphasizes control of the money supply to manage inflation","Supply-side theory calls for higher taxation to fund public investment","Keynesian theory opposes any government intervention in the economy"],
a:1,why:"Monetarism puts the money supply at the centre. Keynes argued for active fiscal intervention; supply-side argues for lower taxes and lighter regulation to expand capacity."},

{el:5,cite:"5.2 · Policy split",teach:"Know who holds which lever. <b>Fiscal policy</b> belongs to <b>government</b>: public spending and taxation. <b>Monetary policy</b> belongs to the <b>Bank of Canada</b>: the policy interest rate and money supply. Both can be expansionary at once — spending up and rates down together push demand hard.",
q:"Government raises infrastructure spending while the central bank cuts rates. Intended combined effect?",
o:["Increased demand and economic growth","Decreased demand and higher unemployment","Reduced inflation and stagnation","Increased saving and lower consumer spending"],
a:0,why:"Both moves are expansionary and push in the same direction: more demand, more activity — at the cost of inflation risk. Note also that fiscal policy is spending and taxation, never interest rates."},

{el:5,cite:"5.3 · Indicators",teach:"Match the report to the question. The <b>Consumer Price Index</b> tracks inflation. The <b>Employment Report</b> covers the labour market. <b>Retail Sales</b> gauges consumer demand. The <b>Bank of Canada Monetary Policy Report</b> explains the Bank's outlook and decisions — it interprets conditions rather than being the primary inflation measure.",
q:"Which report is primarily used to track changes in the inflation rate?",
o:["Consumer Price Index Report","Retail Sales Report","Employment Report","Bank of Canada Monetary Policy Report"],
a:0,why:"CPI is the direct measure of consumer price inflation. The Monetary Policy Report is a tempting distractor because it discusses inflation, but it is commentary and forecast, not the index itself."},

{el:5,cite:"5.5 · Cycle",teach:"Sectors take turns. In an <b>expansion</b>, <b>cyclical</b> sectors — technology, consumer discretionary, industrials — tend to lead because spending and capital investment rise. In a <b>contraction</b>, <b>defensive</b> sectors — utilities, consumer staples, healthcare — hold up better because their demand barely moves.",
q:"Which sector is most likely to perform well during an economic expansion?",
o:["Utilities","Consumer staples","Technology","Healthcare"],
a:2,why:"Technology is cyclical and benefits from rising business and consumer spending. The other three are classic defensives — steady through downturns, but not the leaders in a boom."},

{el:5,cite:"5.6 · Ratios",teach:"Pick the ratio by the question it answers. <b>Return on equity (ROE)</b> — profitability relative to shareholders' capital. <b>Price-to-earnings (P/E)</b> — valuation, price against earnings. <b>Current ratio</b> — liquidity. <b>EBIT</b> — an earnings figure, not a ratio at all.",
q:"Which is most commonly used to measure a company's profitability?",
o:["Return on equity","Price-to-earnings ratio","Earnings before interest and taxes","Current ratio"],
a:0,why:"ROE measures profit generated per dollar of shareholders' equity. P/E is a valuation multiple and EBIT is a raw earnings number — useful, but neither is a profitability ratio."},

{el:5,cite:"5.7 · Takeovers",teach:"Takeover legislation exists to protect the people with the least power in a deal: <b>shareholders</b>. It forces disclosure, fixes minimum bid periods and requires that all shareholders be treated equally, so control cannot change hands quietly or on unfair terms.",
q:"What is the primary purpose of legislation governing takeovers in Canada?",
o:["To let companies pursue takeovers without external regulation","To protect shareholders and guard against unfair or coercive takeovers","To encourage takeovers as a growth strategy","To cap the number of takeovers in an industry"],
a:1,why:"Shareholder protection through disclosure and equal treatment. The law neither promotes nor rations takeovers — it polices how they are conducted."},

{el:5,cite:"5.8 · Analysis types",teach:"Three lenses. <b>Fundamental</b> — financial statements and economics to estimate intrinsic value. <b>Quantitative</b> — statistical measures such as <b>standard deviation</b>, the standard proxy for volatility. <b>Technical</b> — price and volume patterns, using tools like moving averages, to read trends.",
q:"Which measure is used in quantitative analysis to describe an asset's volatility?",
o:["Standard deviation","Dividend yield","Moving average","Relative strength index"],
a:0,why:"Standard deviation quantifies dispersion of returns — the workhorse volatility measure. Moving averages and RSI are technical indicators; dividend yield is an income measure."},

{el:5,cite:"5.9 · Technical tools",teach:"A <b>moving average</b> takes the average price over a rolling window, <b>smoothing out noise</b> so a trend becomes visible. It says nothing about a company's intrinsic worth or profitability — that is fundamental territory.",
q:"What is the main purpose of a moving average in technical analysis?",
o:["To smooth price data and identify trends over a period","To determine a stock's intrinsic value","To assess profitability over a period","To calculate a normal debt-to-equity ratio"],
a:0,why:"Smoothing to reveal trend. Intrinsic value and profitability come from fundamental analysis of the business, not from the shape of the price line."},
{el:6,cite:"6.1 · Best execution",teach:"<b>Best execution</b> means using reasonable efforts to get the <b>most advantageous terms reasonably available</b> — price, speed, certainty of execution and total cost together, not price alone. In a fast market that usually means using the firm's trading desks, smart routing and algorithms across venues.",
q:"A client orders 1,000 shares in a highly volatile market. To meet best execution, the dealer should:",
o:["Execute immediately at whatever the current market price is","Split the order across several days regardless of instructions","Use available trading desks and algorithms to optimize price and speed","Delay execution until conditions settle"],
a:2,why:"Best execution weighs price, speed and likelihood of completion together, which is exactly what routing tools are for. Blindly hitting the market, stalling, or unilaterally stretching the order over days all substitute one factor for the whole obligation."},

{el:6,cite:"6.1 · Manipulation",teach:"<b>Manipulative and deceptive practices</b> create a false impression of price or trading activity. The classic is the <b>wash trade</b> — orders that match against yourself so there is <b>no change in beneficial ownership</b>, inflating apparent volume. Also here: quote stuffing, spoofing, and marking the close.",
q:"Which practice is manipulative or deceptive?",
o:["Entering an order considered to be off market","Entering an order for execution at a prespecified future date","Entering multiple orders that create no change in beneficial ownership","Entering orders in different securities to execute at the same time"],
a:2,why:"No change in beneficial ownership means nothing real happened — only the appearance of activity, which is the essence of a wash trade. Off-market prices and simultaneous orders in different names can be entirely legitimate."},

{el:6,cite:"6.4 · Front running",teach:"<b>Front running</b> is trading ahead of a client order you know about, to profit from the price move that order will cause. It abuses knowledge you hold only because of the client relationship — which is what distinguishes it from <b>insider trading</b>, which turns on material non-public information about the <b>issuer</b>.",
q:"An IR knows a client is about to buy 10,000 shares and first buys 1,000 for their own account. This is:",
o:["Front running","Market manipulation","Insider trading","Unauthorized trading"],
a:0,why:"The abused information is knowledge of a pending client order, not confidential information about the company — so it is front running. Unauthorized trading would mean trading in the client's account without permission."},

{el:6,cite:"6.2 · Gatekeeping",teach:"<b>Gatekeeper obligations</b> make market participants the first line of defence: watch client activity against their normal pattern, and <b>identify, escalate and report suspicious transactions and potential market abuse</b>. You are not required to prove wrongdoing — you are required to notice and escalate.",
q:"What is the primary purpose of gatekeeping obligations under UMIR?",
o:["To monitor and enforce trade execution","To ensure only qualified investors access certain securities","To prevent and identify suspicious transactions and market abuses","To facilitate clearing and settlement"],
a:2,why:"Detection and prevention of abuse. Gatekeeping is about escalating what looks wrong, which is why knowing a client's normal financial patterns is part of the obligation."},

{el:6,cite:"6.1 · Algorithms & DEA",teach:"An <b>algorithm</b> is software generating orders to a strategy; <b>direct electronic access (DEA)</b> lets a client send orders through a dealer's marketplace connection. Neither gets special treatment: <b>algorithmic orders are subject to the same rules as manual orders</b>, and the dealer remains responsible for supervising and controlling the flow.",
q:"Which is true of algorithmic trading under UMIR?",
o:["Algorithms must model manual trading behaviour","Algorithmic orders are treated the same as manual orders","Algorithms must operate without human oversight","Algorithmic orders take priority over manual orders"],
a:1,why:"Same rules, same accountability — with human supervision and controls required, not prohibited. Speed does not buy priority or a lighter rulebook."},

{el:6,cite:"6.1 · Principal trading",teach:"<b>Agency</b> trading means the dealer arranges execution on the client's behalf and earns a commission. <b>Principal</b> trading means the dealer is the <b>counterparty</b>, filling the client from its own inventory and earning the spread. Principal trades carry conflict-of-interest and disclosure obligations because the firm is on the other side.",
q:"A dealer fills a client's buy order out of its own inventory. This is:",
o:["An agency trade, since the dealer acted for the client","A principal trade, since the dealer was the counterparty","A wash trade, since the dealer was on both sides","A discretionary trade"],
a:1,why:"Trading from inventory makes the dealer the counterparty — a principal trade. It is not a wash trade, because beneficial ownership genuinely changed hands between two parties."},

{el:6,cite:"6.6 · Limit orders",teach:"A <b>market order</b> executes now at the best available price — certainty of execution, uncertain price. A <b>limit order</b> sets a <b>maximum price to buy or a minimum price to sell</b> — certainty of price, uncertain execution. It can sit unfilled indefinitely.",
q:"A limit order to buy 1,000 XYZ at $50 is entered while XYZ trades at $52. Which is true?",
o:["It may remain unfilled if the market never reaches the limit","It executes immediately at the best available price","It executes as soon as the price exceeds $50","It converts to a market order if $50 is not reached in time"],
a:0,why:"A buy limit at $50 will not pay $52; it waits for the market to come to it, and may never fill. Nothing converts it to a market order automatically."},

{el:6,cite:"6.6 · Order types",teach:"Four more to keep straight. <b>Immediate or cancel</b> — fill what you can right now, kill the rest. <b>Fill or kill</b> — all of it immediately or none. <b>On-stop</b> — dormant until a trigger price is hit, then it activates. <b>Iceberg</b> — only a slice of the size is displayed publicly.",
q:"A trader wants a large order worked without revealing its full size to the market. Which order type?",
o:["Fill or kill","Immediate or cancel","Iceberg","On-stop"],
a:2,why:"An iceberg shows a small visible portion while the bulk sits hidden, reducing market impact. Fill or kill and IOC are about immediacy, and on-stop is about a trigger price."},

{el:6,cite:"6.7 · Corrections",teach:"Executed trades are not casually undone. Where an error or system malfunction produces a bad price, the fix runs through the <b>marketplace and the market regulator</b> — the participant requests a correction or cancellation under the applicable rules. Neither party may simply rewrite the price and bind the counterparty.",
q:"An order executes at the wrong price because of a system error. What is the standard procedure?",
o:["Accept it — an execution is final once done","Request a correction from the exchange, following notice from the market regulator","Cancel the order and demand a refund from the counterparty","Change the execution price manually, binding on the counterparty"],
a:1,why:"Corrections go through the venue and the regulator so both sides and the audit trail are respected. Unilateral repricing or demanding a refund from a counterparty are not recognized remedies."},

{el:6,cite:"6.10 · Margin",teach:"A <b>margin account</b> lets a client borrow from the dealer to buy securities, using the portfolio as <b>collateral</b>. Margin is the deposit that keeps the position open and covers potential losses; leverage magnifies gains and losses alike, so risk disclosure and suitability matter more, not less.",
q:"A client wants to borrow to buy stocks using their existing portfolio as collateral. Which account?",
o:["RRSP","TFSA","Cash account","Margin account"],
a:3,why:"Only a margin account permits borrowing against the portfolio. Registered plans such as RRSPs and TFSAs cannot be used this way, and a cash account requires full payment."},

{el:6,cite:"6.11 · Derivative accounts",teach:"Before a client trades derivatives, the firm must put a <b>specialized trading agreement</b> in place setting out the risks and each side's responsibilities, alongside the derivatives account application and risk disclosure statement. Where <b>margin</b> is used, a <b>Margin Agreement Form</b> records the client's obligations.",
q:"Before allowing a client to trade futures, what is the representative's primary step?",
o:["Provide a general trading agreement covering all securities","Offer a specialized trading agreement outlining the risks and responsibilities","Obtain approval from a regulatory body for that client","Verify financial status and advance a margin loan"],
a:1,why:"Derivatives require their own agreement — a general securities agreement will not do. Regulators approve firms and individuals, not individual clients."},

{el:6,cite:"6.12 · Reporting",teach:"Dealers owe periodic and event-driven reports to CIRO — including <b>short position reports</b> filed in the regular reporting cycle. The trigger is the reporting requirement itself, not whether a position happens to have become volatile or uncomfortable.",
q:"A dealer holds a significant short position in a stock that turns volatile. What does compliance require?",
o:["Disclose the short position to CIRO within the next reporting cycle","Raise margin on every client account holding the stock","File a report with the CSA","Close the position immediately to reduce risk"],
a:0,why:"Short positions are reported to CIRO on the normal cycle. Volatility does not create a duty to close a position, nor does it redirect reporting to the CSA."},
{el:7,cite:"7.1 · Asset classes",teach:"Five buckets a dealer typically trades: <b>cash and equivalents</b> (T-bills, money market), <b>fixed income</b> (bonds), <b>equity</b> (shares), <b>commodities</b>, and <b>derivatives</b> (contracts whose value comes from something else). Derivatives are the odd one out — they are <b>contracts</b>, not ownership of an underlying asset.",
q:"Which statement about asset classes is accurate?",
o:["A derivative gives direct ownership of the underlying asset","Treasury bills are classified as fixed income equity hybrids","A derivative derives its value from an underlying interest without conferring ownership","Commodities are a sub-category of equity"],
a:2,why:"A derivative is a contract referencing an underlying interest — you can be exposed to oil without owning a barrel. T-bills sit in cash and equivalents, and commodities are their own class."},

{el:7,cite:"7.2 · Common shares",teach:"A <b>common share</b> is ownership: normally <b>voting rights</b>, a <b>residual claim</b> (paid last, after creditors and preferred shareholders), dividends that are <b>discretionary</b>, and <b>unlimited upside</b>. Downside is limited to the amount invested — that is limited liability, not a promise of safety.",
q:"What is a defining feature of common shares that shapes their risk and return?",
o:["Voting rights and potential for capital appreciation","A maturity date and interest payments","Government guarantee of dividends","Automatic conversion into preferred shares"],
a:0,why:"Ownership brings a vote and open-ended upside — with no maturity, no guaranteed income, and last place in a wind-up. A maturity date and interest describe a bond."},

{el:7,cite:"7.2 · Preferred shares",teach:"<b>Preferred shares</b> sit between bonds and common equity: a <b>fixed dividend</b> that ranks <b>ahead of common</b> dividends, priority over common in a wind-up, and usually <b>no vote</b>. In exchange for that priority, they give up most of the growth.",
q:"Compared with common shares, preferred shares generally offer:",
o:["Greater voting power and higher growth potential","Priority for dividends and in liquidation, with limited capital appreciation","A guaranteed return of principal at a fixed maturity","Higher risk with no income entitlement"],
a:1,why:"Preference means priority for income and on wind-up, at the price of upside and usually the vote. They are still equity — the dividend is not a legally enforceable debt like a coupon."},

{el:7,cite:"7.3 · Dividends",teach:"Canadian dividends get favourable tax treatment through the <b>dividend tax credit</b>. The dividend is grossed up and a credit applied, so <b>eligible Canadian dividends are taxed at a lower effective rate than interest income</b>. Capital gains have their own treatment; dividends are not taxed as capital gains.",
q:"How are dividends from Canadian corporations taxed?",
o:["At the same rate as interest income, with no preferential treatment","At a lower effective rate because of the dividend tax credit","Exempt if reinvested in the same company's shares","As capital gains rather than income"],
a:1,why:"The dividend tax credit is the whole point of the gross-up mechanism. Reinvesting does not defer tax, and dividends are dividend income, not capital gains."},

{el:7,cite:"7.3 · Managed vs direct",teach:"The core trade-off: <b>managed products</b> pool money and buy many holdings, giving <b>diversification</b> and professional management for a fee. <b>Individual equities</b> give direct ownership of specific companies, full control and no management layer — but concentration risk sits with the investor.",
q:"What is the main distinction between managed products and individual equities?",
o:["Managed products invest only in derivatives; equities only in foreign markets","Managed products are controlled by the investor; equities are professionally managed","Managed products diversify across multiple assets; equities are shares in specific companies","Managed products guarantee fixed returns; equities fluctuate"],
a:2,why:"Diversification versus direct ownership. Nothing in a managed product is guaranteed, and the control runs the other way — the investor picks their own equities but delegates in a fund."},

{el:7,cite:"7.4 · Credit risk",teach:"A government bond from a stable sovereign is the low-risk benchmark. A <b>corporate bond</b> with a weaker credit rating adds <b>credit or default risk</b>: the issuer may fail to pay coupons or repay principal. That extra risk is why it must offer a <b>higher yield</b> — the credit spread.",
q:"What additional risk does a lower-rated corporate bond carry over a government bond?",
o:["The issuer may default, causing loss of principal and interest","The issuer pays a fixed rate that cannot be adjusted","It is guaranteed to return less than a government bond","It is exempt from interest rate risk"],
a:0,why:"Default risk is the added exposure, compensated by a higher yield. Every bond carries interest rate risk, and a fixed coupon is a feature of bonds generally, not a corporate-specific risk."},

{el:7,cite:"7.4 · Money market & STRIPs",teach:"Two short-form instruments. <b>Treasury bills and commercial paper</b> are short-term, issued at a <b>discount</b> and redeemed at face value — the gain replaces a coupon. A <b>STRIP</b> is a bond whose coupons have been stripped from the principal and sold separately, so each piece pays <b>no interest</b> and matures at face value.",
q:"Which statement is correct?",
o:["Treasury bills pay a semi-annual coupon like a government bond","STRIPs pay no coupon and are purchased at a discount to face value","Commercial paper is a long-term government security","STRIPs guarantee a floating rate of interest"],
a:1,why:"STRIPs and T-bills both work through the discount, not a coupon stream. Commercial paper is short-term corporate borrowing, not a government instrument."},

{el:7,cite:"7.5 · Coupon vs yield",teach:"The <b>coupon</b> is fixed at issue as a percentage of face value — it never changes. The <b>yield</b> is what you actually earn given the <b>price you paid</b>. Buy below par and yield exceeds coupon; buy above par and yield falls short. Prices and yields move in opposite directions.",
q:"An investor buys a 4% coupon bond below par. What is true of the yield?",
o:["The yield equals the coupon, since the coupon is fixed","The yield is higher than the coupon, because the price paid was below face value","The yield is lower than the coupon, because the coupon never changes","Yield cannot be determined without knowing the credit rating"],
a:1,why:"Paying less for the same fixed coupon stream and the same face value at maturity raises your return. This inverse relationship between price and yield is the single most tested bond idea."},

{el:7,cite:"7.5 · Yield drivers",teach:"Yields rise when money gets more expensive or bonds get less wanted: a <b>central bank rate increase</b>, higher inflation expectations, heavier issuance, or a worsening credit picture. Yields fall when demand surges — for example, a flight to safety in a downturn — or when rate expectations drop.",
q:"Which factor is most likely to increase government bond yields?",
o:["A decrease in inflation expectations","Reduced bond issuance from lower government spending","Increased demand for government bonds during a downturn","An increase in the central bank rate to slow aggregate demand"],
a:3,why:"Raising the policy rate lifts the whole yield structure. The other three all push yields down — lower inflation expectations, less supply, and stronger demand each raise bond prices."},

{el:7,cite:"7.5 · Bond risk",teach:"Three components to assess a bond: <b>term</b> (longer means more exposure to rate moves), <b>credit rating</b> (chance of default) and <b>duration</b> (sensitivity of price to a change in yields). Longer duration equals bigger price swing for a given rate move.",
q:"Two bonds have identical credit ratings, but one has a longer duration. What follows?",
o:["The longer-duration bond will fall further in price if yields rise","The longer-duration bond carries greater default risk","Duration measures the probability of default","The longer-duration bond is immune to interest rate risk"],
a:0,why:"Duration measures price sensitivity to yield changes, not default probability — that is what the credit rating is for. More duration means a sharper price move in either direction."},

{el:7,cite:"7.5 · Debt market access",teach:"Unlike listed shares, most Canadian bonds trade <b>over the counter (OTC)</b> — dealer to dealer and dealer to client, rather than on an exchange order book. For reliable data on government debt and rates, go to a primary source such as the <b>Bank of Canada</b>, not forums or opinion pieces.",
q:"Which is a main consideration for market access to debt trading in Canada?",
o:["Debt securities can only be traded through public exchanges","Bond trading is restricted to institutional investors","Debt securities can be traded over the counter","Canadian investment in overseas bonds is prohibited"],
a:2,why:"OTC is the norm for fixed income, which is why price transparency and best execution take extra care. Retail investors can and do buy bonds, and there is no ban on foreign bonds."},

{el:7,cite:"7.6 · Indices",teach:"An <b>average</b> simply sums prices and divides, so a high-priced share dominates. An <b>index</b> is usually <b>market-capitalization weighted</b>, so a company's influence reflects its size. And <b>price return</b> counts only price movement, while <b>total return</b> adds reinvested dividends — the honest number for comparison.",
q:"What is the main difference between an equity index and an average of stock prices?",
o:["An index averages prices; an average assumes equal value in each share","An index considers market capitalization; an average sums individual prices","An index uses the median; an average uses the mean of capitalization","An index covers one industry; an average covers several"],
a:1,why:"Cap-weighting is the distinguishing feature: size drives influence in an index, price drives it in a simple average. Remember too that a total return index includes dividends and will outrun the price index over time."},

{el:7,cite:"7.8 · Fund structures",teach:"Most Canadian mutual funds are <b>trusts</b>, which flow income through to unitholders keeping its character — <b>interest, dividends and capital gains are each taxed in the investor's hands accordingly</b>. A <b>mutual fund corporation</b> is a company issuing shares, which can allow switching between classes and pays out as dividends or capital gains.",
q:"What are the tax considerations of managed products?",
o:["They are subject to tax on capital gains, interest income and dividends","They are not subject to tax, so taxes do not affect returns","Only dividends are taxed, not gains or interest","They are taxed at a flat rate regardless of income type"],
a:0,why:"Income keeps its character as it flows through, so all three types can be taxed. There is no flat rate and certainly no exemption — tax is one of the three drags alongside fees and turnover."},

{el:7,cite:"7.8 · Income trusts",teach:"An <b>income trust</b> holds cash-generating assets and <b>distributes most of its cash flow</b> to unitholders, which is why yields typically exceed those of ordinary equities. High distributions are not the same as safety — the payout can be cut and the units can fall.",
q:"What makes income trusts attractive to income-seeking investors?",
o:["They distribute most of their cash flow, often producing higher yields","They guarantee capital preservation in all market conditions","They are tax-advantaged for every type of investor","They generate returns mainly through capital gains"],
a:0,why:"High cash distribution is the appeal. Nothing about the structure preserves capital, and the tax outcome depends on the investor and the type of income distributed."},

{el:7,cite:"7.8 · Closed-end vs ETF",teach:"A <b>closed-ended fund</b> issues a <b>fixed number of units</b> at launch; afterwards you buy from another investor in the market, so the price can drift to a <b>premium or discount</b> to net asset value. An <b>ETF</b> uses a creation and redemption mechanism, so units can be issued or redeemed continuously and the price tracks NAV closely.",
q:"What distinguishes closed-ended funds from ETFs?",
o:["Closed-ended funds have a fixed number of shares available","Closed-ended funds trade without being listed on exchanges","Closed-ended fund shares are continuously issued and redeemed","Closed-ended funds return principal to investors"],
a:0,why:"The fixed unit count is the defining feature, and the reason discounts and premiums to NAV persist. Continuous issue and redemption describes the ETF."},

{el:7,cite:"7.8 · Wrap funds",teach:"A <b>wrap fund</b> or fund of funds bundles a whole portfolio of investments under a <b>single fee structure</b> instead of charging separately for each component. Convenience and one bill — but watch for fee layering, where the wrap fee sits on top of the underlying funds' own costs.",
q:"How are wrap funds best described?",
o:["Limited to government debt securities","A portfolio of investment products under a single fee structure","Focused solely on fixed income, excluding equities","Charged as separate fees for each asset in the fund"],
a:1,why:"One wrapper, one fee, a diversified portfolio inside. The separate-fee-per-asset option describes exactly what a wrap is designed to avoid."},

{el:7,cite:"7.10 · Fund information",teach:"The <b>Fund Facts</b> document for mutual funds and <b>ETF Facts</b> for ETFs are the plain-language summaries: what the fund invests in, risk ranking, past performance, and costs. They are the required source for clients — not blogs, forums or news commentary. For ETFs, also distinguish the <b>market price</b> from <b>net asset value</b>.",
q:"Which is a key information source for a client evaluating a mutual fund?",
o:["Local news outlets","The Fund Facts document","Investment forums on social media","Blogs written by other investors"],
a:1,why:"Fund Facts is the regulated disclosure document designed for exactly this purpose, and must be delivered to the client. Everything else in that list is unverified opinion."},

{el:7,cite:"7.12 · Hedge funds",teach:"<b>Hedge funds</b> chase absolute returns using leverage, short selling and derivatives. Their trade-offs: <b>high fees</b> (often a management fee plus performance fee), <b>limited liquidity</b> with lock-ups and redemption windows, limited transparency, and sale restricted to investors who qualify under exemptions.",
q:"What is a key disadvantage of hedge funds?",
o:["They are marketed to all investors regardless of experience","They must deliver above-market returns for less risk","They often carry higher fees than regulated funds and offer limited liquidity","They must disclose holdings publicly at all times"],
a:2,why:"Fees and illiquidity are the real costs. They are not sold to everyone — access is restricted through prospectus exemptions — and they are not required to publish holdings, which is part of the transparency problem."},

{el:7,cite:"7.12 · Crypto assets",teach:"Most <b>crypto assets</b> run on <b>blockchain</b> — a decentralized, distributed ledger of transactions with no central authority. That is the defining feature. They are not generally backed by a currency, not centrally guaranteed, and offer no assured return. In Canada, <b>crypto-asset trading platforms</b> face their own approval and pricing-transparency requirements.",
q:"A dealer's crypto-asset trading platform draws complaints about pricing inconsistent with other venues. What must the dealer do?",
o:["Record the complaints but take no action, since crypto sits outside securities regulation","Reprice the platform to match its other marketplaces exactly","Ensure pricing transparency by disclosing how prices are determined and showing they follow the platform's stated policies","Suspend trading until prices match other venues"],
a:2,why:"The obligation is transparency and consistency with disclosed methodology, not price-matching every other venue. And crypto platforms are squarely within the regulatory perimeter — the first option fails on that alone."},
